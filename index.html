<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio - Mercados evolutivos</title>
    
    <!-- 1. FAVICON DE LA PESTAÑA -->
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/aandresfx/portafolio/cf4948803ebae83693ffc6006fd9d64c787aaa76/Mercados%20evolutivos.png">

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #e0e5ec;
            --card-bg: rgba(255, 255, 255, 0.75);
            --text-main: #2d3748;
            --text-muted: #718096;
            --border-color: #e2e8f0;
            --input-bg: rgba(255, 255, 255, 0.9);
            --input-border: #cbd5e0;
            --bar-bg: #edf2f7;
            --zero-line: #a0aec0;
            --axis-line: #cbd5e0;
            --shadow: 0 8px 32px rgba(31, 38, 135, 0.1);
            --glass-border: 1px solid rgba(255, 255, 255, 0.5);
            --bar-gap: 25px;
            --chart-label-size: 11px;
        }

        body.dark-mode {
            --bg-color: #1a202c;
            --card-bg: rgba(45, 55, 72, 0.75);
            --text-main: #f7fafc;
            --text-muted: #a0aec0;
            --border-color: #4a5568;
            --input-bg: rgba(26, 32, 44, 0.9);
            --input-border: #4a5568;
            --bar-bg: #4a5568;
            --zero-line: #718096;
            --axis-line: #4a5568;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --glass-border: 1px solid rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            background-size: cover;
            background-position: center;
            background-attachment: fixed; 
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            transition: background 0.3s ease, color 0.3s ease;
            position: relative;
            overflow-x: hidden;
        }

        /* --- LAYOUTS DINÁMICOS --- */
        .container {
            max-width: 1800px;
            width: 100%;
            display: grid;
            gap: 20px;
            align-items: start;
            z-index: 1;
            transition: all 0.3s ease;
            grid-template-columns: minmax(0, 1fr);
            grid-template-areas: "chart";
        }

        .container.show-table { grid-template-areas: "chart" "table"; }
        
        .container.show-alerts { 
            grid-template-columns: minmax(0, 1fr) 360px; 
            grid-template-areas: "chart alerts"; 
        }
        
        .container.show-table.show-alerts { 
            grid-template-columns: minmax(0, 1fr) 360px; 
            grid-template-areas: "chart alerts" "table table"; 
        }

        @media (max-width: 1200px) {
            .container, .container.show-table, .container.show-alerts, .container.show-table.show-alerts { 
                grid-template-columns: 1fr; 
                grid-template-areas: "chart" "alerts" "table"; 
            }
        }

        .panel-tabla { grid-area: table; display: none; }
        .panel-grafico { grid-area: chart; display: flex; }
        
        .panel-alertas { 
            grid-area: alerts; 
            display: none; 
            flex-direction: column; 
            height: 100%; 
        }

        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: var(--glass-border);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 15px;
            transition: background 0.3s ease, opacity 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .panel-header {
            display: flex; justify-content: space-between; align-items: center;
            position: relative; margin-bottom: 15px; padding: 0 10px;
        }
        h2 { margin: 0; font-size: 18px; text-align: center; text-transform: uppercase; letter-spacing: 1px; flex-grow: 1; }
        
        .header-tools { display: flex; gap: 5px; }
        .icon-btn {
            background: transparent; border: none; color: var(--text-muted);
            font-size: 14px; cursor: pointer; padding: 4px; border-radius: 4px; transition: all 0.2s;
        }
        .icon-btn:hover { color: var(--text-main); background: rgba(0,0,0,0.05); }
        body.dark-mode .icon-btn:hover { background: rgba(255,255,255,0.1); }

        .datetime-display {
            position: absolute; top: 15px; left: 20px; font-size: 14px;
            color: var(--text-muted); font-weight: 600; z-index: 10;
        }

        .dropdown-menu {
            position: absolute; top: 35px; background: var(--card-bg); border: var(--glass-border);
            border-radius: 8px; padding: 15px; box-shadow: var(--shadow); z-index: 50;
            display: none; flex-direction: column; gap: 8px; font-size: 12px; backdrop-filter: blur(10px);
            max-height: 80vh; overflow-y: auto;
        }
        .dropdown-menu.active { display: flex; }
        .dropdown-menu label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .dropdown-menu hr { width: 100%; border: 0; border-top: 1px solid var(--border-color); margin: 5px 0; }
        
        #chart-settings-menu { right: 10px; width: 240px; }
        #table-settings-menu { left: 10px; width: 200px; }

        /* Estilos para la lista arrastrable de textos */
        #chart-labels-list { display: flex; flex-direction: column; gap: 4px; margin-top: 5px; }
        .drag-item {
            display: flex; align-items: center; gap: 8px; padding: 6px 8px;
            background: var(--input-bg); border: 1px solid var(--border-color);
            border-radius: 6px; cursor: grab; user-select: none;
        }
        .drag-item:active { cursor: grabbing; }
        .drag-handle { color: var(--text-muted); font-size: 14px; font-weight: bold; letter-spacing: -1px;}

        .table-container { width: 100%; overflow-x: auto; flex-grow: 1; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 5px 3px; text-align: left; border-bottom: 1px solid var(--border-color); vertical-align: middle; white-space: nowrap; }
        
        th { font-size: 10px; color: var(--text-muted); text-transform: uppercase; cursor: grab; user-select: none; }
        th:active { cursor: grabbing; }
        
        input, select {
            padding: 5px; border: 1px solid var(--input-border); border-radius: 4px;
            font-family: inherit; font-size: 11px; box-sizing: border-box; background: var(--input-bg); color: var(--text-main);
            transition: border-color 0.2s;
        }
        input:focus, select:focus { border-color: #4299e1; outline: none; }
        
        .in-name { width: 80px; }
        .in-investor { width: 85px; }
        .in-cap { width: 65px; text-align: right; }
        .in-cost { width: 55px; text-align: right; }
        .in-date { width: 75px; text-align: center; }
        .in-mod { width: 85px; }
        .in-status { width: 95px; }
        .in-num { width: 45px; text-align: center; }
        .in-url { width: 60px; font-size: 10px; }
        .in-notes { width: 80px; }
        .in-check { width: 16px; height: 16px; cursor: pointer; accent-color: #4299e1; }
        .in-alert { width: 45px; text-align: center; }
        .in-news { width: 35px; text-align: center; }
        .in-daily-limit { width: 55px; text-align: center; }
        .in-risk { width: 55px; text-align: center; }
        .in-risk-usd { width: 65px; text-align: right; }
        
        .btn-delete {
            background: transparent; border: none; cursor: pointer; font-size: 14px; color: #e53e3e; transition: transform 0.2s;
            flex-shrink: 0;
        }
        .btn-delete:hover { transform: scale(1.2); }

        .btn-add {
            background: #4299e1; color: white; border: none; padding: 10px 15px;
            border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 15px;
            width: 100%; font-size: 13px; transition: background 0.2s;
        }
        .btn-add:hover { background: #3182ce; }

        /* --- GRÁFICO (ALINEACIÓN PERFECTA) --- */
        .chart-layout { 
            display: flex; 
            position: relative; 
            margin-top: 10px;
            padding-bottom: 10px;
            flex-grow: 1;
        }

        .y-axis {
            position: relative; 
            width: 35px; 
            height: 400px;
            border-right: 1px solid var(--axis-line); 
            margin-right: 15px; 
            margin-top: 40px; 
            flex-shrink: 0;
        }
        .y-tick {
            position: absolute; right: 5px; transform: translateY(-50%);
            font-size: 11px; color: var(--text-muted); font-weight: 600;
        }
        .y-tick::after { content: ''; position: absolute; right: -16px; top: 50%; width: 10px; height: 1px; background: var(--axis-line); }

        .y-tick-minor {
            position: absolute; right: 5px; transform: translateY(-50%);
            font-size: 9px;
            color: var(--text-muted); 
            font-weight: normal;
            opacity: 0.8;
        }
        .y-tick-minor::after { 
            content: ''; position: absolute; right: -16px; top: 50%; 
            width: 5px; height: 1px; background: var(--axis-line); opacity: 0.4; 
        }

        .charts-wrapper { 
            display: flex; 
            gap: var(--bar-gap); 
            flex-grow: 1; 
            position: relative; 
            height: 560px;
            overflow-x: auto;
            overflow-y: hidden; 
            padding-top: 40px; 
            padding-left: 30px;
        }

        .global-zero-line {
            position: absolute; width: 100%; height: 1px;
            background-color: var(--zero-line); z-index: 0; border-bottom: 1px dashed var(--axis-line);
        }

        .chart-column { 
            position: relative; 
            width: 45px; 
            height: 400px;
            flex-shrink: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        .bar-container { 
            position: relative; 
            width: 100%; 
            height: 400px; 
            cursor: pointer;
        }
        .bar-container:hover .bar-fill { opacity: 0.8; }

        /* --- SEPARADOR DE AÑOS --- */
        .year-divider {
            position: relative;
            width: 1px;
            height: 400px;
            background-color: var(--axis-line);
            flex-shrink: 0;
            opacity: 0.5;
            margin: 0 5px; 
        }
        .year-label {
            position: absolute;
            top: -35px; 
            left: 50%;
            transform: translateX(-50%);
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            white-space: nowrap;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .avatar-container {
            position: absolute;
            top: -40px; 
            left: 50%;
            transform: translateX(-50%);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--input-bg);
            border: 2px solid var(--border-color);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            overflow: hidden;
            z-index: 5;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: bold; color: var(--text-muted);
        }
        .avatar-container img { width: 100%; height: 100%; object-fit: cover; }

        .bar-range-bg {
            position: absolute; width: 100%; background-color: var(--bar-bg);
            border-radius: 4px; z-index: 1; display: flex; justify-content: center;
        }

        .target-text {
            position: absolute; top: -20px; font-size: 11px; font-weight: 700; color: var(--text-muted);
        }
        
        .min-text {
            position: absolute; bottom: -20px; font-size: 11px; font-weight: 700; color: var(--text-muted);
        }

        .bar-fill {
            position: absolute; width: 100%; border-radius: 4px; z-index: 2; 
            transition: all 0.3s ease; display: flex; align-items: center; justify-content: center;
        }

        .val-text { font-size: 11px; font-weight: bold; text-align: center; line-height: 1.1; }

        .labels-area { 
            position: absolute;
            top: 100%; 
            width: 110px; 
            text-align: center; 
            padding-top: 10px; 
            z-index: 10; 
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .labels-area:hover { background: rgba(255, 255, 255, 0.1); }

        .name-text { 
            font-size: var(--chart-label-size); 
            font-weight: 600; 
            margin-bottom: 4px; 
            word-wrap: break-word; 
            white-space: normal;
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .alert-text { font-size: 14px; margin-bottom: 2px; }
        .cap-text { font-size: calc(var(--chart-label-size) - 1px); color: var(--text-main); font-weight: bold; margin-bottom: 2px; }
        .cost-text { font-size: calc(var(--chart-label-size) - 1px); color: #e53e3e; font-weight: bold; margin-bottom: 2px; }
        .risk-text { font-size: calc(var(--chart-label-size) - 2px); color: #ffffff; font-weight: bold; margin-bottom: 2px; }
        .status-text { font-size: calc(var(--chart-label-size) + 1px); margin-bottom: 2px; white-space: normal; }
        .date-text { font-size: calc(var(--chart-label-size) - 2px); color: var(--text-muted); margin-bottom: 2px; }
        .audit-link { font-size: calc(var(--chart-label-size) - 1px); color: #4299e1; text-decoration: none; display: block; margin-bottom: 4px; font-weight: 600;}
        .audit-link:hover { text-decoration: underline; }
        .notes-text { font-size: calc(var(--chart-label-size) - 2px); color: var(--text-muted); font-style: italic; word-wrap: break-word; white-space: normal; line-height: 1.1;}

        /* --- BOTONES FLOTANTES Y PANELES --- */
        .settings-btn, .management-btn, .alert-btn, .table-btn {
            position: fixed; left: 20px; 
            background: var(--card-bg); color: var(--text-main);
            border: var(--glass-border); border-radius: 50%; 
            width: 45px; height: 45px; font-size: 20px; cursor: pointer;
            box-shadow: var(--shadow); z-index: 100; 
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s, opacity 0.2s; backdrop-filter: blur(10px);
        }
        .settings-btn:hover, .management-btn:hover, .alert-btn:hover, .table-btn:hover { transform: scale(1.1); }
        
        .settings-btn { bottom: 20px; }
        .management-btn { bottom: 75px; font-size: 22px; }
        .alert-btn { bottom: 130px; font-size: 20px; }
        .table-btn { bottom: 185px; font-size: 20px; }

        .btn-inactive { opacity: 0.4; }

        .settings-panel, .management-panel {
            position: fixed; left: 20px; 
            background: var(--card-bg); border: var(--glass-border);
            border-radius: 10px; padding: 15px; width: 340px; box-shadow: var(--shadow); z-index: 100;
            display: none; flex-direction: column; gap: 10px; backdrop-filter: blur(10px);
            max-height: 75vh; overflow-y: auto;
        }
        .settings-panel.active, .management-panel.active { display: flex; }
        
        .settings-panel { bottom: 75px; }
        .management-panel { bottom: 130px; }

        .settings-panel label, .management-panel label { font-size: 12px; font-weight: 600; display: flex; justify-content: space-between; align-items: center;}
        .settings-panel input[type="color"] { width: 30px; height: 25px; padding: 0; border: none; cursor: pointer; flex-shrink: 0;}
        .settings-input { width: 100%; padding: 6px; font-size: 11px; margin-top: 5px; }
        
        .toggle-btn {
            background: #4299e1; color: white; border: none; padding: 8px;
            border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px;
        }
        .toggle-btn.secondary { background: #718096; }
        .toggle-btn:hover { opacity: 0.9; }
        .checkbox-label { font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer; }
        input[type="range"] { width: 100%; cursor: pointer; }
        
        .company-list, .investor-list, .modality-list { display: flex; flex-direction: column; gap: 8px; margin-top: 5px; max-height: 180px; overflow-y: auto; padding-right: 5px;}
        .list-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .list-row input[type="text"] { flex: 1; min-width: 0; padding: 4px 6px; font-size: 11px; }
        .list-row img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-color); flex-shrink: 0;}
        .list-row .avatar-placeholder { width: 24px; height: 24px; border-radius: 50%; background: #ccc; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #333; flex-shrink: 0;}

        /* --- PESTAÑAS DEL MENÚ DE GESTIÓN --- */
        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        .tab-btn {
            flex: 1;
            padding: 6px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
            color: var(--text-muted);
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: #4299e1;
            color: white;
            border-color: #4299e1;
        }
        .tab-content {
            display: none;
            flex-direction: column;
            gap: 10px;
        }
        .tab-content.active {
            display: flex;
        }

        /* --- BOTÓN DE ALERTA (MONITOREO) --- */
        .btn-alert {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 4px;
            padding: 4px 0;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            width: 100%;
            text-align: center;
            color: var(--text-muted);
            min-height: 26px;
        }
        .btn-alert.active {
            background: rgba(255, 193, 7, 0.2);
            border-color: #ffc107;
            color: var(--text-main);
            font-weight: bold;
        }

        /* --- MODAL DE EDICIÓN --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--card-bg); padding: 25px; border-radius: 12px;
            border: var(--glass-border); box-shadow: var(--shadow);
            width: 300px; text-align: center; display: flex; flex-direction: column; gap: 15px;
            animation: scaleIn 0.2s ease-out;
        }
        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-content h3 { margin: 0; font-size: 16px; color: var(--text-main); font-weight: 600; }
        .modal-input {
            font-size: 24px; text-align: center; padding: 10px;
            width: 100%; border-radius: 8px; font-weight: bold;
            background: var(--input-bg); border: 1px solid var(--input-border); color: var(--text-main);
            box-sizing: border-box;
        }
        .modal-input:focus { border-color: #4299e1; outline: none; box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.2); }
        .modal-actions { display: flex; gap: 10px; justify-content: center; margin-top: 5px; }
        .modal-actions .toggle-btn { flex: 1; padding: 10px; }

        /* --- PANEL DE MONITOREO Y MANTENIMIENTO --- */
        #alert-list-container {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
        }
        .section-title {
            font-size: 11px;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
            margin-bottom: 5px;
            padding-left: 5px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }
        .alert-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--input-bg);
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.2s;
        }
        .alert-item:hover { background: rgba(66, 153, 225, 0.1); }
        
        .alert-item.maintenance-item {
            background: rgba(229, 62, 62, 0.15);
            border-color: rgba(229, 62, 62, 0.3);
        }
        .alert-item.maintenance-item:hover {
            background: rgba(229, 62, 62, 0.25);
        }

        .alert-content {
            display: flex; align-items: center; gap: 4px; width: 100%; overflow: hidden;
        }
        
        .btn-clear-alert {
            background: transparent; border: none; cursor: pointer; font-size: 16px; color: #38a169; flex-shrink: 0;
        }

        /* --- MARCA DE AGUA Y LOGO FLOTANTE --- */
        .brand-container {
            position: fixed; bottom: 25px; right: 25px;
            display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
            z-index: 100; pointer-events: none;
        }
        .brand-logo {
            display: flex; align-items: center; gap: 8px;
            background: var(--card-bg); border: var(--glass-border);
            padding: 4px 12px 4px 4px; border-radius: 50px;
            box-shadow: var(--shadow); backdrop-filter: blur(10px);
        }
        .brand-logo img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; background-color: var(--input-bg); }
        .brand-logo span { font-size: 12px; font-weight: 600; color: var(--text-main); letter-spacing: 0.5px; }
        .watermark { font-size: 12px; color: var(--text-muted); opacity: 0.8; font-weight: 500; }
        .watermark a { color: inherit; text-decoration: none; font-weight: bold; }
        .watermark a:hover { text-decoration: underline; opacity: 1; }
    </style>
</head>
<body>

    <!-- MODAL DE EDICIÓN -->
    <div class="modal-overlay" id="edit-modal">
        <div class="modal-content">
            <h3 id="modal-title">Editar Porcentaje</h3>
            <input type="number" step="0.1" id="modal-input" class="modal-input" autofocus onkeydown="if(event.key==='Enter') saveModalValue()">
            <div class="modal-actions">
                <button class="toggle-btn" onclick="saveModalValue()">Guardar</button>
                <button class="toggle-btn secondary" onclick="closeEditModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <div class="container" id="main-container">
        <!-- Panel Gráfico (Siempre visible) -->
        <div class="panel-grafico glass-panel" id="panel-grafico-export">
            <div class="datetime-display" id="datetime-display"></div>

            <div class="panel-header">
                <div style="width: 60px;"></div>

            <span>Mercados Evolutivos</span>

            creado por <a href="https://www.instagram.com/aandresfx/" target="_blank">aandres.fx</a>

    <script>
        // --- COLUMNAS ---
        const columnasDef = [
            { key: 'visible', label: '👁' },
            { key: 'name', label: 'Empresa' },
            { key: 'investor', label: 'Inversor' },
            { key: 'capital', label: 'Capital' },
            { key: 'cost', label: 'Costo' },
            { key: 'risk', label: 'Riesgo %' }, 
            { key: 'dailyLimit', label: 'Lím. Diario' }, 
            { key: 'risk_usd', label: 'Riesgo $' }, 
            { key: 'startDate', label: 'Inicio' },
            { key: 'lastActivity', label: 'Últ. Actividad' }, 
            { key: 'modality', label: 'Modalidad' },
            { key: 'status', label: 'Estado' },
            { key: 'actual', label: 'Actual' },
            { key: 'min', label: 'Mín' },
            { key: 'max', label: 'Obj' },
            { key: 'url', label: 'URL' },
            { key: 'notes', label: 'Notas' },
            { key: 'alert', label: 'Monitoreo' }, 
            { key: 'news', label: 'Noticia 📰' }, 
            { key: 'actions', label: '' }
        ];

        let columnOrder = JSON.parse(localStorage.getItem('columnOrder')) || ['visible', 'name', 'investor', 'capital', 'cost', 'risk', 'dailyLimit', 'risk_usd', 'startDate', 'lastActivity', 'modality', 'status', 'actual', 'min', 'max', 'url', 'notes', 'alert', 'news', 'actions'];
        columnOrder = columnOrder.filter(k => columnasDef.find(c => c.key === k));
        columnasDef.forEach(c => { if(!columnOrder.includes(c.key)) columnOrder.push(c.key); });
        
        let visibleCols = JSON.parse(localStorage.getItem('visibleCols')) || ['visible', 'name', 'investor', 'capital', 'cost', 'risk', 'dailyLimit', 'risk_usd', 'startDate', 'lastActivity', 'modality', 'status', 'actual', 'min', 'max', 'url', 'notes', 'alert', 'news', 'actions'];

        // --- ORDEN DE TEXTOS EN GRÁFICO ---
        let chartLabelsOrder = JSON.parse(localStorage.getItem('chartLabelsOrder')) || [
            'investor', 'alert', 'name', 'capital', 'cost', 'risk', 'risk_usd', 'status', 'date', 'url', 'notes'
        ];
        
        if (!chartLabelsOrder.includes('modality')) {
            chartLabelsOrder.push('modality');
            localStorage.setItem('chartLabelsOrder', JSON.stringify(chartLabelsOrder));
        }

        // --- DATOS ---
        let cuentas = JSON.parse(localStorage.getItem('misCuentasPro')) || [
            { visible: true, name: "FTMO", investor: "Andrés", capital: 100000, cost: -510, risk: 1.25, dailyLimit: -5, startDate: "01/09/2024", lastActivity: "10/11/2026", modality: "Examen", status: "En curso ⏳", actual: -9.4, min: -10, max: 10, notes: "Fase 1/2", url: "", alert: "", news: true },
            { visible: true, name: "FTMO", investor: "Lucía", capital: 25000, cost: -250, risk: 1.25, dailyLimit: -5, startDate: "02/10/2024", lastActivity: "01/11/2026", modality: "Examen", status: "Aprobado ✅", actual: 10.0, min: -10, max: 10, notes: "Fase 1/2", url: "https://www.myfxbook.com", alert: "💻", news: false },
            { visible: true, name: "Bullfy", investor: "Andrés", capital: 5000, cost: -100, risk: 1.0, dailyLimit: -4, startDate: "10/10/2026", lastActivity: "20/10/2026", modality: "Mixto", status: "Desaprobado ❌", actual: -3.0, min: -4, max: 8, notes: "Fase Única", url: "", alert: "", news: true },
            { visible: true, name: "Axi", investor: "Lucía", capital: 10000, cost: 0, risk: 1.0, dailyLimit: null, startDate: "15/11/2026", lastActivity: "15/11/2026", modality: "Capital propio", status: "En curso ⏳", actual: 2.5, min: null, max: null, notes: "Ahorros", url: "", alert: "", news: false }
        ];

        // MIGRACIÓN DE DATOS
        cuentas.forEach(c => {
            if (c.news === undefined) c.news = false;
            if (c.dailyLimit === undefined) c.dailyLimit = null;
            if (c.lastActivity === undefined) c.lastActivity = "";
            if (c.alert === '⏰') c.alert = '💻'; 
        });

        let empresas = JSON.parse(localStorage.getItem('misEmpresas'));
        if (!empresas || empresas.length === 0) {
            empresas = [
                { name: "FTMO", color: "#3182ce" },
                { name: "Darwinex", color: "#4a5568" },
                { name: "Axi", color: "#e53e3e" },
                { name: "Bullfy", color: "#dd6b20" }
            ];
        }

        let inversores = JSON.parse(localStorage.getItem('misInversores'));
        if (!inversores || inversores.length === 0) {
            inversores = [
                { name: "Usuario 1", avatar: "" },
                { name: "Usuario 2", avatar: "" }
            ];
        }

        let modalidades = JSON.parse(localStorage.getItem('misModalidades'));
        if (!modalidades || modalidades.length === 0) {
            modalidades = [
                { name: "Examen", color: "#2d3748" },
                { name: "Capital propio", color: "#fefcbf" },
                { name: "Mixto", color: "#e9d8fd" }
            ];
        }

        let colores = JSON.parse(localStorage.getItem('misColores')) || { 
            pos: "#38a169", neg: "#e53e3e", 
            passed: "#a3e635", failed: "#7f1d1d",
            ownPos: "#3b82f6", ownNeg: "#ec4899"
        };

        let chartLabels = JSON.parse(localStorage.getItem('chartLabels')) || {
            investor: true, name: true, capital: true, cost: true, risk: true, risk_usd: true, status: true, date: true, url: true, notes: true, alert: true, modality: false
        };
        if (chartLabels.modality === undefined) chartLabels.modality = false;

        let chartFilters = { year: 'all', company: 'all', investor: 'all', modality: 'all', status: 'all' };

        let barValueDisplay = localStorage.getItem('barValueDisplay') || 'pct'; 

        let isDarkMode = localStorage.getItem('darkMode') === 'true';
        let savedBgImage = localStorage.getItem('bgImage') || 'https://raw.githubusercontent.com/aandresfx/portafolio/982689e9cb64e93a4624b0eaca9f3e0a1b6e6190/Fondo.jpg';
        let overlayOpacity = parseInt(localStorage.getItem('overlayOpacity') || 50);
        let barGap = parseInt(localStorage.getItem('barGap') || 25);
        let chartFontSize = parseInt(localStorage.getItem('chartFontSize') || 11);
        
        let currentSort = { key: null, dir: 'asc' };
        let isDraggingColumn = false;
        let tempAvatarBase64 = "";

        // MODAL VARIABLES
        let editingIndex = -1;

        // ESTADO DE UI
        let showTable = localStorage.getItem('showTable') !== 'false';
        let showAlerts = localStorage.getItem('showAlerts') === 'true';

        // Inicializar UI
        function initUI() {
            document.getElementById('color-pos').value = colores.pos;
            document.getElementById('color-neg').value = colores.neg;
            document.getElementById('color-passed').value = colores.passed;
            document.getElementById('color-failed').value = colores.failed;
            document.getElementById('color-own-pos').value = colores.ownPos;
            document.getElementById('color-own-neg').value = colores.ownNeg;

            document.getElementById('bar-val-display').value = barValueDisplay;
            
            document.getElementById('gap-slider').value = barGap;
            document.documentElement.style.setProperty('--bar-gap', barGap + 'px');
            
            document.getElementById('font-size-slider').value = chartFontSize;
            document.getElementById('font-size-val').innerText = chartFontSize;
            document.documentElement.style.setProperty('--chart-label-size', chartFontSize + 'px');

            document.getElementById('bg-opacity').value = overlayOpacity;
            document.getElementById('opacity-val').innerText = overlayOpacity;
            
            if(isDarkMode) document.body.classList.add('dark-mode');

            updateLayout();
            renderCompanyList();
            renderInvestorList();
            renderModalityList();
            renderTableSettings();
            renderChartLabelsMenu();
            populateFilters();
            renderAlertPanel(); 
        }
        initUI();

        // --- CONTROL DE LAYOUT ---
        function updateLayout() {
            const container = document.getElementById('main-container');
            const panelTabla = document.getElementById('panel-tabla');
            const panelAlertas = document.getElementById('panel-alertas');
            
            if (showTable) container.classList.add('show-table'); else container.classList.remove('show-table');
            if (showAlerts) container.classList.add('show-alerts'); else container.classList.remove('show-alerts');
            
            panelTabla.style.display = showTable ? 'flex' : 'none';
            panelAlertas.style.display = showAlerts ? 'flex' : 'none';

            document.getElementById('btn-toggle-table').classList.toggle('btn-inactive', !showTable);
            document.getElementById('btn-toggle-alerts').classList.toggle('btn-inactive', !showAlerts);
            
            localStorage.setItem('showTable', showTable);
            localStorage.setItem('showAlerts', showAlerts);
        }

        function toggleTable() {
            showTable = !showTable;
            updateLayout();
        }

        function toggleAlerts() {
            showAlerts = !showAlerts;
            updateLayout();
            if(showAlerts) renderAlertPanel();
        }

        // --- PANEL DE MONITOREO Y MANTENIMIENTO ---
        function getDaysDiff(dateStr) {
            if(!dateStr) return 999; 
            
            const parts = dateStr.split('/');
            if(parts.length !== 3) return 999;
            
            const targetDate = new Date(parts[2], parts[1]-1, parts[0]);
            const today = new Date();
            today.setHours(0, 0, 0, 0); 
            
            const diffTime = Math.abs(today - targetDate);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
            return diffDays;
        }

        function renderAlertPanel() {
            const list = document.getElementById('alert-list-container');
            if(!list) return;
            list.innerHTML = '';
            
            // --- LISTADO DE MONITOREO ---
            const alertas = cuentas.filter(c => c.alert);
            
            list.innerHTML += `<div class="section-title">MONITOREO</div>`;
            
            if (alertas.length === 0) {
                list.innerHTML += '<div style="text-align:center; padding: 10px; font-size:11px; color:var(--text-muted);">No hay cuentas en monitoreo</div>';
            } else {
                alertas.forEach(c => {
                    const originalIndex = cuentas.indexOf(c);
                    const item = document.createElement('div');
                    item.className = 'alert-item';
                    
                    item.onclick = (e) => {
                        if(e.target.closest('.btn-clear-alert')) return;
                        openEditModal(originalIndex);
                    };

                    const modColor = getModColor(c.modality);
                    const modText = getContrastColor(modColor);
                    const riskUsdVal = ((Number(c.capital) || 0) * (Number(c.risk) || 0)) / 100;

                    let avatarHtml = '';
                    if (c.investor) {
                        const inv = inversores.find(i => i.name === c.investor);
                        if (inv && inv.avatar) {
                            avatarHtml = `<img src="${inv.avatar}" style="width: 20px; height: 20px; border-radius: 50%; object-fit: cover; flex-shrink: 0;">`;
                        } else {
                            const initial = c.investor.charAt(0).toUpperCase();
                            avatarHtml = `<div style="width: 20px; height: 20px; border-radius: 50%; background: var(--border-color); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; flex-shrink: 0;">${initial}</div>`;
                        }
                    }

                    // Línea de MONITOREO: avatar -> empresa -> capital -> % actual -> modalidad -> noticias -> limite diario -> riesgo USD -> riesgo %
                    item.innerHTML = `
                        <div class="alert-content">
                            ${avatarHtml}
                            <span style="font-size: 11px; font-weight: bold; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 50px;">${c.name}</span>
                            <span style="font-size: 10px; color: var(--text-muted); white-space: nowrap;">${getCurrencyStr(c.capital)}</span>
                            <span style="font-size: 11px; font-weight: bold; color: ${c.actual > 0 ? colores.pos : (c.actual < 0 ? colores.neg : 'var(--text-main)')}; white-space: nowrap;">${getPercentStr(c.actual, 1)}</span>
                            <span style="font-size: 9px; background: ${modColor}; color: ${modText}; padding: 1px 4px; border-radius: 3px; white-space: nowrap;">${c.modality}</span>
                            ${c.news ? '<span style="font-size: 11px;" title="Noticia de alto impacto">📰</span>' : ''}
                            <span style="font-size: 10px; color: #e53e3e; font-weight: bold; white-space: nowrap;">${c.dailyLimit ? getPercentStr(c.dailyLimit, 0) : '-'}</span>
                            <span style="font-size: 10px; color: var(--text-muted); white-space: nowrap;">${getCurrencyStr(riskUsdVal)}</span>
                            <span style="font-size: 10px; color: var(--text-muted); white-space: nowrap;">${getSmartPercentStr(c.risk)}</span>
                            <button class="btn-clear-alert" onclick="clearAlertFromPanel(${originalIndex})" title="Quitar de Monitoreo" style="margin-left: auto;">✅</button>
                        </div>
                    `;
                    list.appendChild(item);
                });
            }

            // --- LISTADO DE MANTENIMIENTO ---
            const mantenimiento = cuentas.filter(c => {
                const days = getDaysDiff(c.lastActivity);
                return days >= 15 && days <= 30; 
            });
            
            list.innerHTML += `<div class="section-title" style="margin-top: 20px;">MANTENIMIENTO MENSUAL</div>`;
            
            if (mantenimiento.length === 0) {
                list.innerHTML += '<div style="text-align:center; padding: 10px; font-size:11px; color:var(--text-muted);">Todas las cuentas están al día</div>';
            } else {
                mantenimiento.forEach(c => {
                    const originalIndex = cuentas.indexOf(c);
                    const item = document.createElement('div');
                    item.className = 'alert-item maintenance-item'; 
                    
                    item.onclick = (e) => {
                        if(e.target.closest('.btn-clear-alert')) return;
                        openEditModal(originalIndex);
                    };

                    const modColor = getModColor(c.modality);
                    const modText = getContrastColor(modColor);
                    const daysSince = getDaysDiff(c.lastActivity);

        function updateClock() {

            const meses = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
            
            const diaSemana = dias[now.getDay()];
            const dia = now.getDate();
            const mes = meses[now.getMonth()];
            const anio = now.getFullYear();
            const hora = String(now.getHours()).padStart(2, '0');
            const minuto = String(now.getMinutes()).padStart(2, '0');
            const segundo = String(now.getSeconds()).padStart(2, '0');
            
            let texto = `${diaSemana} ${dia} de ${mes} ${anio}, ${hora}:${minuto}:${segundo} hs`;
            texto = texto.charAt(0).toUpperCase() + texto.slice(1); 
            
            document.getElementById('datetime-display').innerText = texto;
            
            if(segundo === '00' && showAlerts) renderAlertPanel();
        }

        // --- UTILIDADES ---
        function getCurrencyStr(num) {
            if(num === null || num === undefined || num === '') return '';
            let n = Number(num);
            if(n < 0) return '-$' + Math.abs(n).toLocaleString('es-AR', {maximumFractionDigits: 0});
            return '$' + n.toLocaleString('es-AR', {maximumFractionDigits: 0});
        }
        function getCostStr(num) {
            if(num === null || num === undefined || num === '') return '';
            let n = Number(num);
            if(n === 0) return '$0';
            return '-$' + Math.abs(n).toLocaleString('es-AR');
        }
        function parseCurrency(str) {
            if(!str) return '';
            let num = str.toString().replace(/[^\d-]/g, '');
            return num ? parseInt(num, 10) : '';
        }
        function getPercentStr(num, decimals) {
            if(num === null || num === undefined || num === '') return '';
            return Number(num).toFixed(decimals) + '%';
        }
        
        // NUEVA FUNCIÓN: Formatea el porcentaje para quitar ceros innecesarios
        function getSmartPercentStr(num) {
            if(num === null || num === undefined || num === '') return '';
            let n = Number(num);
            if (n % 1 === 0) return n.toFixed(0) + '%';
            if (n * 10 % 1 === 0) return n.toFixed(1) + '%';
            return n.toFixed(2) + '%';
        }

        function parsePercent(str) {
            if(!str) return '';
            let num = str.toString().replace(',', '.').replace(/[^\d.-]/g, '');
            return num ? parseFloat(num) : '';
        }
        
        function formatDate(input) {
            let val = input.value.replace(/\D/g, '');
            if (val.length > 2 && val.length <= 4) {
                val = val.substring(0, 2) + '/' + val.substring(2);
            } else if (val.length > 4) {
                let day = val.substring(0, 2);
                let month = val.substring(2, 4);
                let year = val.substring(4);
                
                if (year.length === 2) year = '20' + year;
                
                val = `${day}/${month}/${year}`;
            }
            input.value = val;
        }

        function parseDate(dateStr) {
            if(!dateStr) return new Date(0);
            const parts = dateStr.split('/');
            if(parts.length === 3) return new Date(parts[2], parts[1]-1, parts[0]);
            return new Date(dateStr);
        }

        function formatMonthYear(dateStr) {
            if(!dateStr) return '';
            const parts = dateStr.split('/');
            if(parts.length === 3) {
                const months = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
                const month = parseInt(parts[1], 10) - 1;
                if(month >= 0 && month < 12) {
                    return `${months[month]} ${parts[2]}`;
                }
            }
            return dateStr; 
        }

        function getContrastColor(hexcolor) {
            if(!hexcolor || hexcolor === 'transparent') return '#ffffff';
            if(hexcolor.indexOf('#') !== 0) return '#ffffff';
            let r = parseInt(hexcolor.substr(1, 2), 16);
            let g = parseInt(hexcolor.substr(3, 2), 16);
            let b = parseInt(hexcolor.substr(5, 2), 16);
            let yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
            return (yiq >= 128) ? '#000000' : '#ffffff';
        }

        function getModColor(modName) {
            const mod = modalidades.find(m => m.name === modName);
            return mod ? mod.color : 'transparent';
        }

        function getAccountColor(cuenta) {
            const isPropio = cuenta.modality === 'Capital propio';
            let displayValue = Number(cuenta.actual) || 0;
            let color = colores.pos;

            if (cuenta.status.includes('Desaprobado') && !isPropio) {
                color = colores.failed;
            } else if (cuenta.status.includes('Aprobado') && !isPropio) {
                color = colores.passed;
            } else if (isPropio) {
                color = displayValue >= 0 ? colores.ownPos : colores.ownNeg;
            } else {
                color = displayValue >= 0 ? colores.pos : colores.neg;
            }
            return color;
        }

        // --- BACKUP & RESTORE ---
        function exportarDatos() {
            const backup = {};
            const keys = [
                'misCuentasPro', 'misEmpresas', 'misInversores', 'misModalidades', 'misColores', 
                'chartLabels', 'chartLabelsOrder', 'barValueDisplay', 'darkMode', 'bgImage', 
                'overlayOpacity', 'barGap', 'chartFontSize', 'columnOrder', 
                'visibleCols', 'showTable', 'showAlerts'
            ];

            keys.forEach(key => {
                const item = localStorage.getItem(key);
                if (item !== null) {
                    backup[key] = item; 
                }
            });

            const dataStr = JSON.stringify(backup, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `Portafolio_Backup_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importarDatos(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    
                    for (const key in data) {
                        if (data.hasOwnProperty(key)) {
                            localStorage.setItem(key, data[key]);
                        }
                    }
                    
                    alert("¡Datos importados con éxito! La página se recargará para aplicar los cambios.");
                    location.reload();
                    
                } catch (error) {
                    console.error(error);
                    alert("Error al leer el archivo. Asegúrate de que sea un archivo de backup válido (.json).");
                }
            };
            reader.readAsText(file);
        }

                                td.innerHTML = `<input type="text" class="in-num" value="${getPercentStr(cuenta.max, 0)}" onfocus="this.value = parsePercent(this.value) || ''; this.select()" onblur="this.value = getPercentStr(parsePercent(this.value), 0); actualizarDato(${index}, 'max', parsePercent(this.value))" onkeydown="if(event.key==='Enter') this.blur()">`;
                            }
                            break;
                        case 'url':
                            td.innerHTML = `<input type="url" class="in-url" value="${cuenta.url || ''}" onfocus="this.select()" onchange="actualizarDato(${index}, 'url', this.value)" placeholder="https://...">`;
                            break;
                        case 'notes':
                            td.innerHTML = `<input type="text" class="in-notes" value="${cuenta.notes || ''}" onfocus="this.select()" onchange="actualizarDato(${index}, 'notes', this.value)" placeholder="...">`;
                            break;
                        case 'alert':
                            td.innerHTML = `<button id="btn-alert-${index}" class="btn-alert ${cuenta.alert ? 'active' : ''}" onclick="toggleAlerta(${index})" title="Activar/Desactivar Monitoreo">${cuenta.alert ? '💻' : ''}</button>`;
                            break;
                        case 'news':
                            // CORRECCIÓN: Añadido id="btn-news-${index}" para actualización instantánea
                            td.innerHTML = `<button id="btn-news-${index}" class="btn-alert ${cuenta.news ? 'active' : ''}" onclick="toggleNews(${index})" title="Activar/Desactivar Noticia" style="font-size:11px; min-height:22px;">${cuenta.news ? '📰' : ''}</button>`;
                            break;
                        case 'actions':
                            td.innerHTML = `<button class="btn-delete" onclick="eliminarCuenta(${index})" title="Eliminar cuenta">🗑️</button>`;
                            break;
                    }
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });

            if(!window.sortableInitialized) {
                new Sortable(theadTr, {
                    animation: 150,
                    onStart: function() { isDraggingColumn = true; },
                    onEnd: function (evt) {
                        const newOrder = Array.from(theadTr.children).map(th => th.dataset.key);
                        const hiddenCols = columnOrder.filter(k => !newOrder.includes(k));
                        columnOrder = [...newOrder, ...hiddenCols];
                        
                        localStorage.setItem('columnOrder', JSON.stringify(columnOrder));
                        renderTabla(); 
                        setTimeout(() => { isDraggingColumn = false; }, 100);
                    }
                });
                window.sortableInitialized = true;
            }
        }

        function sortTable(key) {
            if (currentSort.key === key) {
                currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort.key = key;
                currentSort.dir = 'asc';
            }

            cuentas.sort((a, b) => {
                let valA = a[key];
                let valB = b[key];

                if (valA === null || valA === undefined) valA = '';
                if (valB === null || valB === undefined) valB = '';

                if (['capital', 'cost', 'actual', 'min', 'max', 'risk', 'dailyLimit', 'risk_usd'].includes(key)) {
                    valA = Number(valA) || 0;
                    valB = Number(valB) || 0;
                } else if (key === 'startDate' || key === 'lastActivity') {
                    valA = parseDate(valA);
                    valB = parseDate(valB);
                } else {
                    valA = valA.toString().toLowerCase();
                    valB = valB.toString().toLowerCase();
                }

                if (valA < valB) return currentSort.dir === 'asc' ? -1 : 1;
                if (valA > valB) return currentSort.dir === 'asc' ? 1 : -1;
                return 0;
            });

            renderTabla();
        }

        function renderGrafico() {
            const chartArea = document.getElementById('chart-area');
            const yAxis = document.getElementById('y-axis');
            
            chartArea.innerHTML = '<div class="global-zero-line" id="global-zero-line"></div>';
            yAxis.innerHTML = '';

            // APLICAR FILTROS
            const cuentasVisibles = cuentas.filter(c => {
                if (c.visible === false) return false;
                
                if (chartFilters.year !== 'all') {
                    const y = c.startDate ? c.startDate.split('/')[2] : '';
                    if (y !== chartFilters.year) return false;
                }
                if (chartFilters.company !== 'all' && c.name !== chartFilters.company) return false;
                if (chartFilters.investor !== 'all' && c.investor !== chartFilters.investor) return false;
                if (chartFilters.modality !== 'all' && c.modality !== chartFilters.modality) return false;
                if (chartFilters.status !== 'all' && c.status !== chartFilters.status) return false;
                
                return true;
            });
            
            cuentasVisibles.sort((a, b) => parseDate(a.startDate) - parseDate(b.startDate));

            let maxAbs = 0; 
            cuentasVisibles.forEach(c => {
                if(c.modality !== 'Capital propio') {
                    const valMin = Math.abs(Number(c.min) || 0);
                    const valMax = Math.abs(Number(c.max) || 0);
                    if (valMin > maxAbs) maxAbs = valMin;
                    if (valMax > maxAbs) maxAbs = valMax;
                }
            });

            if (maxAbs < 5) maxAbs = 5;

            let globalMax = Math.ceil(maxAbs / 5) * 5;

            if (globalMax === maxAbs) {
                globalMax += 5;
            }

            const globalMin = -globalMax;
            const rangeGlobal = globalMax - globalMin;
            const zeroBottomPercent = 50; 

            const step = rangeGlobal > 30 ? 10 : 5;
            
            for (let i = globalMin; i <= globalMax; i += 2.5) {
                const topPercent = 100 - (((i - globalMin) / rangeGlobal) * 100);
                const tick = document.createElement('div');
                
                if (i % step === 0) {
                    tick.className = 'y-tick';
                    tick.innerText = `${i}%`;
                } else {
                    tick.className = 'y-tick-minor';
                    tick.innerText = `${i}%`; 
                }
                
                tick.style.top = `${topPercent}%`;
                yAxis.appendChild(tick);
            }

            document.getElementById('global-zero-line').style.top = `240px`; 

            let prevYear = null;

            cuentasVisibles.forEach((cuenta, index) => {
                let year = cuenta.startDate ? cuenta.startDate.split('/')[2] : '';

                // Lógica para los separadores de año
                if (year !== prevYear && year !== '') {
                    const divider = document.createElement('div');
                    divider.className = 'year-divider';
                    if (index === 0) {
                        divider.style.background = 'transparent'; 
                        divider.style.border = 'none';
                    }
                    divider.innerHTML = `<div class="year-label">${year}</div>`;
                    chartArea.appendChild(divider);
                }

                const column = document.createElement('div');
                column.className = 'chart-column';
                const isPropio = cuenta.modality === 'Capital propio';
                
                let displayValue = Number(cuenta.actual) || 0;
                let color = getAccountColor(cuenta);
                
                const textColor = getContrastColor(color);
                
                let valStr;
                if (displayValue % 1 === 0) {
                    valStr = displayValue.toFixed(0);
                } else {
                    valStr = displayValue.toFixed(1);
                }
                const pctStr = displayValue > 0 ? `+${valStr}%` : `${valStr}%`;
                
                const usdVal = ((Number(cuenta.capital) || 0) * displayValue) / 100;
                const usdStr = getCurrencyStr(usdVal);

                let textoValor = '';
                if (barValueDisplay === 'pct') {
                    textoValor = pctStr;
                } else if (barValueDisplay === 'usd') {
                    textoValor = usdStr;
                } else {
                    textoValor = `${pctStr}<br><span style="font-size:0.85em; opacity:0.8;">${usdStr}</span>`;
                }

                let rangeHeightPercent = 0;
                let rangeBottomPercent = 0;
                if(!isPropio && cuenta.min !== '' && cuenta.max !== '') {
                    rangeHeightPercent = ((Number(cuenta.max) - Number(cuenta.min)) / rangeGlobal) * 100;
                    rangeBottomPercent = ((Number(cuenta.min) - globalMin) / rangeGlobal) * 100;
                }

                let fillHeightPercent = (Math.abs(displayValue) / rangeGlobal) * 100;
                let fillBottomPercent = zeroBottomPercent;
                if (displayValue < 0) fillBottomPercent = zeroBottomPercent - fillHeightPercent;
                if (displayValue === 0) fillHeightPercent = 0;

                let targetHTML = (!isPropio && cuenta.max !== '' && cuenta.max !== null) ? `<div class="target-text">${Number(cuenta.max).toFixed(0)}%</div>` : '';
                let minHTML = (!isPropio && cuenta.min !== '' && cuenta.min !== null) ? `<div class="min-text">${Number(cuenta.min).toFixed(0)}%</div>` : '';
                
                let labelsHTML = '';
                chartLabelsOrder.forEach(key => {
                    if (!chartLabels[key]) return; 

                    switch(key) {
                        case 'investor':
                            if (cuenta.investor) {
                                const inv = inversores.find(i => i.name === cuenta.investor);
                                if (inv && inv.avatar) {
                                    labelsHTML += `<div class="avatar-container"><img src="${inv.avatar}" alt="${inv.name}"></div>`;
                                } else {
                                    const initial = cuenta.investor.charAt(0).toUpperCase();
                                    labelsHTML += `<div class="avatar-container" title="${cuenta.investor}">${initial}</div>`;
                                }
                            }
                            break;
                        case 'alert':
                            if (cuenta.alert) labelsHTML += `<div class="alert-text">${cuenta.alert}</div>`;
                            break;
                        case 'name':
                            const empColor = empresas.find(e => e.name === cuenta.name)?.color || 'var(--text-main)';
                            const empTextColor = getContrastColor(empColor);
                            labelsHTML += `<div class="name-text" style="background-color: ${empColor}; color: ${empTextColor};">${cuenta.name}</div>`;
                            break;
                        case 'modality':
                            if (cuenta.modality) {
                                const modColor = getModColor(cuenta.modality);
                                const modTextColor = getContrastColor(modColor);
                                labelsHTML += `<div class="name-text" style="background-color: ${modColor}; color: ${modTextColor}; font-size: calc(var(--chart-label-size) - 1px);">${cuenta.modality}</div>`;
                            }
                            break;
                        case 'capital':
                            labelsHTML += `<div class="cap-text">${getCurrencyStr(cuenta.capital)}</div>`;
                            break;
                        case 'cost':
                            if (cuenta.cost !== '' && cuenta.cost !== null && cuenta.cost !== undefined) {
                                labelsHTML += `<div class="cost-text">${getCostStr(cuenta.cost)}</div>`;
                            }
                            break;
                        case 'risk':
                            if (cuenta.risk) labelsHTML += `<div class="risk-text"> ${getPercentStr(cuenta.risk, 2)}</div>`;
                            break;
                        case 'risk_usd':
                            if (cuenta.risk) {
                                let riskUsdVal = (Number(cuenta.capital) || 0) * (Number(cuenta.risk) || 0) / 100;
                                labelsHTML += `<div class="risk-text"> ${getCurrencyStr(riskUsdVal)}</div>`;
                            }
                            break;
                        case 'status':
                            if (cuenta.status) {
                                let soloEmoji = cuenta.status.split(' ').pop(); 
                                labelsHTML += `<div class="status-text">${soloEmoji}</div>`;
                            }
                            break;
                        case 'date':
                            if (cuenta.startDate) labelsHTML += `<div class="date-text">${formatMonthYear(cuenta.startDate)}</div>`;
                            break;
                        case 'url':
                            if (cuenta.url && cuenta.url.trim() !== '') labelsHTML += `<a href="${cuenta.url}" target="_blank" class="audit-link">Auditoría</a>`;
                            break;
                        case 'notes':
                            if (cuenta.notes) labelsHTML += `<div class="notes-text">${cuenta.notes}</div>`;
                            break;
                    }
                });

                column.innerHTML = `
                    <div class="bar-container">
                        ${labelsHTML.includes('avatar-container') ? labelsHTML.substring(0, labelsHTML.indexOf('</div>') + 6) : ''}
                        ${!isPropio ? `<div class="bar-range-bg" style="bottom: ${rangeBottomPercent}%; height: ${rangeHeightPercent}%;">${targetHTML}${minHTML}</div>` : ''}
                        <div class="bar-fill" style="bottom: ${fillBottomPercent}%; height: ${fillHeightPercent}%; background-color: ${color};">
                            <span class="val-text" style="color: ${textColor};">${textoValor}</span>
                        </div>
                    </div>
                    <div class="labels-area" title="Clic para activar/desactivar monitoreo">
                        ${labelsHTML.includes('avatar-container') ? labelsHTML.replace(labelsHTML.substring(0, labelsHTML.indexOf('</div>') + 6), '') : labelsHTML}
                    </div>
                `;
                
                const originalIndex = cuentas.findIndex(c => c === cuenta);

                // Clic en la barra abre el modal de edición
                const barContainer = column.querySelector('.bar-container');
                barContainer.onclick = (e) => {
                    if(e.target.closest('.avatar-container') || e.target.tagName === 'A') return;
                    openEditModal(originalIndex); 
                };

                // Clic en el área de los textos activa/desactiva la alerta (monitoreo)
                const labelsArea = column.querySelector('.labels-area');
                labelsArea.onclick = (e) => {
                    if(e.target.closest('.avatar-container') || e.target.tagName === 'A') return;
                    toggleAlerta(originalIndex);
                };
                
                chartArea.appendChild(column);

                if (year) prevYear = year;
            });
        }

        // --- EXPORTAR IMAGEN (PANTALLA COMPLETA) ---
        function exportChart() {
            const body = document.body;
            const panels = document.querySelectorAll('.glass-panel');

            const originalBgAttachment = body.style.backgroundAttachment;
            const originalBackdrops = Array.from(panels).map(p => p.style.backdropFilter);
            const originalWebkitBackdrops = Array.from(panels).map(p => p.style.webkitBackdropFilter);

            body.style.backgroundAttachment = 'scroll'; 
            
            panels.forEach(p => {
                p.style.backdropFilter = 'none';
                p.style.webkitBackdropFilter = 'none';
            });

            const bgColor = isDarkMode ? '#1a202c' : '#e0e5ec';

            html2canvas(body, { 
                scale: 2,
                backgroundColor: bgColor,
                useCORS: true,
                scrollX: 0,
                scrollY: 0
            }).then(canvas => {
                body.style.backgroundAttachment = originalBgAttachment;
                panels.forEach((p, i) => {
                    p.style.backdropFilter = originalBackdrops[i];
                    p.style.webkitBackdropFilter = originalWebkitBackdrops[i];
                });

                const link = document.createElement('a');
                link.download = `Portafolio_${new Date().toISOString().slice(0,10)}.png`;
                link.href = canvas.toDataURL('image/png', 1.0);
                link.click();
            }).catch(err => {
                console.error("Error al exportar:", err);
                body.style.backgroundAttachment = originalBgAttachment;
                panels.forEach((p, i) => {
                    p.style.backdropFilter = originalBackdrops[i];
                    p.style.webkitBackdropFilter = originalWebkitBackdrops[i];
                });
                alert("Hubo un error al generar la imagen. Revisa la consola.");
            });
        }

        function agregarEmpresa() {
            const nameInput = document.getElementById('new-company-name');
            const colorInput = document.getElementById('new-company-color');
            const name = nameInput.value.trim();
            const color = colorInput.value;

            if(name && !empresas.find(e => e.name.toLowerCase() === name.toLowerCase())) {
                empresas.push({ name: name, color: color });
                localStorage.setItem('misEmpresas', JSON.stringify(empresas));
                nameInput.value = '';
                renderCompanyList();
                renderTabla();
                renderGrafico();
                populateFilters();
            } else if(name) {
                alert("La empresa ya existe.");
            }
        }

        // --- GESTIÓN DE INVERSORES ---
        function renderInvestorList() {
            const list = document.getElementById('investor-list');
            list.innerHTML = '';
            inversores.forEach((inv, index) => {
                const row = document.createElement('div');
                row.className = 'list-row';
                const avatarSrc = inv.avatar ? `<img src="${inv.avatar}">` : `<div class="avatar-placeholder">${inv.name.charAt(0)}</div>`;
                row.innerHTML = `
                    ${avatarSrc}
                    <input type="text" value="${inv.name}" onchange="cambiarNombreInversor(${index}, this.value)">
                    <button class="btn-delete" onclick="eliminarInversor(${index})" title="Eliminar">🗑️</button>
                `;
                list.appendChild(row);
            });
        }

        function cambiarNombreInversor(index, nuevoNombre) {
            if(!nuevoNombre.trim()) { renderInvestorList(); return; }
            const oldName = inversores[index].name;
            inversores[index].name = nuevoNombre.trim();
            localStorage.setItem('misInversores', JSON.stringify(inversores));
            
            cuentas.forEach(c => { if(c.investor === oldName) c.investor = nuevoNombre.trim(); });
            guardarYRenderizar();
            renderInvestorList();
        }

        function previewAvatar(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    tempAvatarBase64 = e.target.result;
                    const preview = document.getElementById('avatar-preview');
                    preview.src = tempAvatarBase64;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        function agregarInversor() {
            const nameInput = document.getElementById('new-investor-name');
            const name = nameInput.value.trim();

            if(name && !inversores.find(i => i.name.toLowerCase() === name.toLowerCase())) {
                inversores.push({ name: name, avatar: tempAvatarBase64 });
                localStorage.setItem('misInversores', JSON.stringify(inversores));
                
                nameInput.value = '';
                tempAvatarBase64 = "";
                const preview = document.getElementById('avatar-preview');
                preview.src = '';
                preview.style.display = 'none';
                document.getElementById('new-investor-avatar').value = '';

                renderInvestorList();
                renderTabla();
                renderGrafico();
                populateFilters();
            } else if(name) {
                alert("El inversor ya existe.");
            }
        }

        function eliminarInversor(index) {
            if(confirm(`¿Eliminar al inversor ${inversores[index].name}?`)) {
                inversores.splice(index, 1);
                localStorage.setItem('misInversores', JSON.stringify(inversores));
                renderInvestorList();
                renderTabla();
                renderGrafico();
                populateFilters();
            }
        }

        // --- GESTIÓN DE MODALIDADES ---
        function renderModalityList() {
            const list = document.getElementById('modality-list');
            if (!list) return;
            list.innerHTML = '';
            modalidades.forEach((mod, index) => {
                const row = document.createElement('div');
                row.className = 'list-row';
                row.innerHTML = `
                    <input type="text" value="${mod.name}" onchange="cambiarNombreModalidad(${index}, this.value)">
                    <input type="color" value="${mod.color}" onchange="cambiarColorModalidad(${index}, this.value)">
                    <button class="btn-delete" onclick="eliminarModalidad(${index})" title="Eliminar">🗑️</button>
                `;
                list.appendChild(row);
            });
        }

        function cambiarNombreModalidad(index, nuevoNombre) {
            if(!nuevoNombre.trim()) { renderModalityList(); return; }
            const oldName = modalidades[index].name;
            modalidades[index].name = nuevoNombre.trim();
            localStorage.setItem('misModalidades', JSON.stringify(modalidades));
            
            cuentas.forEach(c => { if(c.modality === oldName) c.modality = nuevoNombre.trim(); });
            guardarYRenderizar();
            renderModalityList();
        }

        function cambiarColorModalidad(index, nuevoColor) {
            modalidades[index].color = nuevoColor;
            localStorage.setItem('misModalidades', JSON.stringify(modalidades));
            renderTabla();
            renderGrafico();
        }

        function eliminarModalidad(index) {
            if(confirm(`¿Eliminar la modalidad ${modalidades[index].name}?`)) {
                modalidades.splice(index, 1);
                localStorage.setItem('misModalidades', JSON.stringify(modalidades));
                renderModalityList();
                renderTabla();
                renderGrafico();
                populateFilters();
            }
        }

        function agregarModalidad() {
            const nameInput = document.getElementById('new-modality-name');
            const colorInput = document.getElementById('new-modality-color');
            const name = nameInput.value.trim();
            const color = colorInput.value;

            if(name && !modalidades.find(m => m.name.toLowerCase() === name.toLowerCase())) {
                modalidades.push({ name: name, color: color });
                localStorage.setItem('misModalidades', JSON.stringify(modalidades));
                nameInput.value = '';
                renderModalityList();
                renderTabla();
                renderGrafico();
                populateFilters();
            } else if(name) {
                alert("La modalidad ya existe.");
            }
        }

        // --- COLUMNAS VISIBLES ---
        function renderTableSettings() {
            const menu = document.getElementById('table-settings-menu');
            menu.innerHTML = '<span style="font-weight:bold; font-size:11px; color:var(--text-muted);">Mostrar columnas:</span>';
            
            columnOrder.forEach(key => {
                const colDef = columnasDef.find(c => c.key === key);
                if (key === 'visible' || key === 'actions') return;

                const label = document.createElement('label');
                const isChecked = visibleCols.includes(key);
                label.innerHTML = `<input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleColumn('${key}', this.checked)"> ${colDef.label}`;
                menu.appendChild(label);
            });
        }

        function toggleColumn(key, isChecked) {
            if(isChecked) {
                if(!visibleCols.includes(key)) visibleCols.push(key);
            } else {
                visibleCols = visibleCols.filter(k => k !== key);
            }
            localStorage.setItem('visibleCols', JSON.stringify(visibleCols));
            renderTabla();
        }

        // Navegación con TAB
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && document.getElementById('edit-modal').classList.contains('active')) {
                closeEditModal();
            }
            
            if (e.key === 'Tab') {
                const inputs = Array.from(document.querySelectorAll('#tabla-datos input, #tabla-datos select')).filter(el => !el.disabled && !el.readOnly);
                const current = document.activeElement;
                if (inputs.includes(current)) {
                    e.preventDefault();
                    const index = inputs.indexOf(current);
                    const isShift = e.shiftKey;
                    let nextIndex = isShift ? index - 1 : index + 1;
                    if (nextIndex >= inputs.length) {
                        document.querySelector('.btn-add').focus();
                    } else if (nextIndex < 0) {
                        inputs[inputs.length - 1].focus();
                    } else {
                        inputs[nextIndex].focus();
                        inputs[nextIndex].select();
                    }
                } else if (current.classList.contains('btn-add') && !e.shiftKey) {
                    e.preventDefault();
                    inputs[0].focus();
                    inputs[0].select();
                }
            }
        });

        guardarYRenderizar();
    </script>
</body>
</html>
