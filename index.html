<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio - Mercados evolutivos</title>
    
    <!-- 1. FAVICON DE LA PESTAÑA -->
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/aandresfx/portafolio/cf4948803ebae83693ffc6006fd9d64c787aaa76/Mercados%20evolutivos.png">

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #e0e5ec;
            --card-bg: rgba(255, 255, 255, 0.75);
            --text-main: #2d3748;
            --text-muted: #718096;
            --border-color: #e2e8f0;
            --input-bg: rgba(255, 255, 255, 0.9);
            --input-border: #cbd5e0;
            --bar-bg: #edf2f7;
            --zero-line: #a0aec0;
            --axis-line: #cbd5e0;
            --shadow: 0 8px 32px rgba(31, 38, 135, 0.1);
            --glass-border: 1px solid rgba(255, 255, 255, 0.5);
            --bar-gap: 25px;
            --chart-label-size: 11px;
        }

        body.dark-mode {
            --bg-color: #1a202c;
            --card-bg: rgba(45, 55, 72, 0.75);
            --text-main: #f7fafc;
            --text-muted: #a0aec0;
            --border-color: #4a5568;
            --input-bg: rgba(26, 32, 44, 0.9);
            --input-border: #4a5568;
            --bar-bg: #4a5568;
            --zero-line: #718096;
            --axis-line: #4a5568;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --glass-border: 1px solid rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            background-size: cover;
            background-position: center;
            background-attachment: fixed; 
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            transition: background 0.3s ease, color 0.3s ease;
            position: relative;
            overflow-x: hidden;
        }

        /* --- LAYOUTS --- */
        .container {
            max-width: 1800px;
            width: 100%;
            display: grid;
            gap: 20px;
            align-items: start; 
            z-index: 1;
            transition: all 0.3s ease;
        }

        .container.layout-side { grid-template-columns: 1fr 1fr; grid-template-areas: "table chart"; }
        .container.layout-bottom { grid-template-columns: 1fr; grid-template-areas: "chart" "table"; }
        .container.layout-top { grid-template-columns: 1fr; grid-template-areas: "table" "chart"; }
        .container.layout-hidden { grid-template-columns: 0fr 1fr; grid-template-areas: "table chart"; gap: 0; }
        
        .container.layout-hidden .panel-tabla {
            opacity: 0; pointer-events: none; padding: 0; margin: 0; overflow: hidden;
        }

        @media (max-width: 1200px) {
            .container.layout-side { grid-template-columns: 1fr; grid-template-areas: "table" "chart"; }
        }

        .panel-tabla { grid-area: table; }
        .panel-grafico { grid-area: chart; }

        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: var(--glass-border);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 15px;
            transition: background 0.3s ease, opacity 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .panel-header {
            display: flex; justify-content: space-between; align-items: center;
            position: relative; margin-bottom: 15px; padding: 0 10px;
        }
        h2 { margin: 0; font-size: 18px; text-align: center; text-transform: uppercase; letter-spacing: 1px; flex-grow: 1; }
        
        .header-tools { display: flex; gap: 5px; }
        .icon-btn {
            background: transparent; border: none; color: var(--text-muted);
            font-size: 14px; cursor: pointer; padding: 4px; border-radius: 4px; transition: all 0.2s;
        }
        .icon-btn:hover { color: var(--text-main); background: rgba(0,0,0,0.05); }
        body.dark-mode .icon-btn:hover { background: rgba(255,255,255,0.1); }

        .datetime-display {
            position: absolute; top: 15px; left: 20px; font-size: 11px;
            color: var(--text-muted); font-weight: 600; text-transform: capitalize; z-index: 10;
        }

        .btn-float-open {
            position: fixed; left: 10px; top: 20px;
            background: var(--card-bg); border: var(--glass-border); border-radius: 50%;
            width: 40px; height: 40px; display: none; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: var(--shadow); z-index: 200; color: var(--text-main); backdrop-filter: blur(10px);
        }
        .container.layout-hidden ~ .btn-float-open { display: flex; }

        .dropdown-menu {
            position: absolute; top: 35px; background: var(--card-bg); border: var(--glass-border);
            border-radius: 8px; padding: 15px; box-shadow: var(--shadow); z-index: 50;
            display: none; flex-direction: column; gap: 8px; font-size: 12px; backdrop-filter: blur(10px);
        }
        .dropdown-menu.active { display: flex; }
        .dropdown-menu label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .dropdown-menu hr { width: 100%; border: 0; border-top: 1px solid var(--border-color); margin: 5px 0; }
        
        #chart-settings-menu { right: 10px; width: 220px; }
        #table-settings-menu { left: 10px; width: 200px; }

        .table-container { width: 100%; overflow-x: auto; flex-grow: 1; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 5px 3px; text-align: left; border-bottom: 1px solid var(--border-color); vertical-align: middle; white-space: nowrap; }
        
        th { font-size: 10px; color: var(--text-muted); text-transform: uppercase; cursor: grab; user-select: none; }
        th:active { cursor: grabbing; }
        
        input, select {
            padding: 5px; border: 1px solid var(--input-border); border-radius: 4px;
            font-family: inherit; font-size: 11px; box-sizing: border-box; background: var(--input-bg); color: var(--text-main);
            transition: border-color 0.2s;
        }
        input:focus, select:focus { border-color: #4299e1; outline: none; }
        
        .in-name { width: 80px; }
        .in-investor { width: 85px; }
        .in-cap { width: 65px; text-align: right; }
        .in-cost { width: 55px; text-align: right; }
        .in-date { width: 75px; text-align: center; }
        .in-mod { width: 85px; }
        .in-status { width: 95px; }
        .in-num { width: 45px; text-align: center; }
        .in-url { width: 60px; font-size: 10px; }
        .in-notes { width: 80px; }
        .in-check { width: 16px; height: 16px; cursor: pointer; accent-color: #4299e1; }
        .in-alert { width: 45px; text-align: center; }
        .in-risk { width: 55px; text-align: center; }
        .in-risk-usd { width: 65px; text-align: right; }
        
        .btn-delete {
            background: transparent; border: none; cursor: pointer; font-size: 14px; color: #e53e3e; transition: transform 0.2s;
            flex-shrink: 0;
        }
        .btn-delete:hover { transform: scale(1.2); }

        .btn-add {
            background: #4299e1; color: white; border: none; padding: 10px 15px;
            border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 15px;
            width: 100%; font-size: 13px; transition: background 0.2s;
        }
        .btn-add:hover { background: #3182ce; }

        /* --- GRÁFICO (ALINEACIÓN PERFECTA) --- */
        .chart-layout { 
            display: flex; 
            position: relative; 
            margin-top: 10px;
            padding-bottom: 10px;
        }

        .y-axis {
            position: relative; 
            width: 35px; 
            height: 300px; 
            border-right: 1px solid var(--axis-line); 
            margin-right: 15px; 
            margin-top: 40px; 
            flex-shrink: 0;
        }
        .y-tick {
            position: absolute; right: 5px; transform: translateY(-50%);
            font-size: 10px; color: var(--text-muted); font-weight: 600;
        }
        .y-tick::after { content: ''; position: absolute; right: -16px; top: 50%; width: 10px; height: 1px; background: var(--axis-line); }

        .charts-wrapper { 
            display: flex; 
            gap: var(--bar-gap); 
            flex-grow: 1; 
            position: relative; 
            height: 460px; 
            overflow-x: auto;
            overflow-y: hidden; 
            padding-top: 40px; 
        }

        .global-zero-line {
            position: absolute; width: 100%; height: 1px;
            background-color: var(--zero-line); z-index: 0; border-bottom: 1px dashed var(--axis-line);
        }

        .chart-column { 
            position: relative; 
            width: 45px; 
            height: 300px; 
            flex-shrink: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        .bar-container { 
            position: relative; 
            width: 100%; 
            height: 300px; 
        }

        .avatar-container {
            position: absolute;
            top: -40px; 
            left: 50%;
            transform: translateX(-50%);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--input-bg);
            border: 2px solid var(--border-color);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            overflow: hidden;
            z-index: 5;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: bold; color: var(--text-muted);
        }
        .avatar-container img { width: 100%; height: 100%; object-fit: cover; }

        .bar-range-bg {
            position: absolute; width: 100%; background-color: var(--bar-bg);
            border-radius: 4px; z-index: 1; display: flex; justify-content: center;
        }

        .target-text {
            position: absolute; top: -20px; font-size: 10px; font-weight: 700; color: var(--text-muted);
        }

        .bar-fill {
            position: absolute; width: 100%; border-radius: 4px; z-index: 2; 
            transition: all 0.3s ease; display: flex; align-items: center; justify-content: center;
        }

        .val-text { font-size: 10px; font-weight: bold; text-align: center; line-height: 1.1; }

        .labels-area { 
            position: absolute;
            top: 100%; 
            width: 110px; 
            text-align: center; 
            padding-top: 10px; 
            z-index: 10; 
        }

        .name-text { 
            font-size: var(--chart-label-size); 
            font-weight: 600; 
            margin-bottom: 4px; 
            word-wrap: break-word; 
            white-space: normal;
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .alert-text { font-size: 14px; margin-bottom: 2px; }
        .cap-text { font-size: calc(var(--chart-label-size) - 1px); color: var(--text-main); font-weight: bold; margin-bottom: 2px; }
        .cost-text { font-size: calc(var(--chart-label-size) - 1px); color: #e53e3e; font-weight: bold; margin-bottom: 2px; }
        .risk-text { font-size: calc(var(--chart-label-size) - 2px); color: #d97706; font-weight: bold; margin-bottom: 2px; }
        .status-text { font-size: calc(var(--chart-label-size) - 1px); margin-bottom: 2px; white-space: normal;}
        .date-text { font-size: calc(var(--chart-label-size) - 2px); color: var(--text-muted); margin-bottom: 2px; }
        .audit-link { font-size: calc(var(--chart-label-size) - 1px); color: #4299e1; text-decoration: none; display: block; margin-bottom: 4px; font-weight: 600;}
        .audit-link:hover { text-decoration: underline; }
        .notes-text { font-size: calc(var(--chart-label-size) - 2px); color: var(--text-muted); font-style: italic; word-wrap: break-word; white-space: normal; line-height: 1.1;}

        /* --- BOTONES FLOTANTES Y PANELES --- */
        .settings-btn, .management-btn {
            position: fixed; left: 20px; 
            background: var(--card-bg); color: var(--text-main);
            border: var(--glass-border); border-radius: 50%; 
            width: 45px; height: 45px; font-size: 20px; cursor: pointer;
            box-shadow: var(--shadow); z-index: 100; 
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s; backdrop-filter: blur(10px);
        }
        .settings-btn:hover, .management-btn:hover { transform: rotate(90deg); }
        
        .settings-btn { bottom: 20px; }
        .management-btn { bottom: 75px; font-size: 22px; }

        .settings-panel, .management-panel {
            position: fixed; left: 20px; 
            background: var(--card-bg); border: var(--glass-border);
            border-radius: 10px; padding: 15px; width: 340px; box-shadow: var(--shadow); z-index: 100;
            display: none; flex-direction: column; gap: 10px; backdrop-filter: blur(10px);
            max-height: 75vh; overflow-y: auto;
        }
        .settings-panel.active, .management-panel.active { display: flex; }
        
        .settings-panel { bottom: 75px; }
        .management-panel { bottom: 130px; }
        
        .settings-panel label, .management-panel label { font-size: 12px; font-weight: 600; display: flex; justify-content: space-between; align-items: center;}
        .settings-panel input[type="color"] { width: 30px; height: 25px; padding: 0; border: none; cursor: pointer; flex-shrink: 0;}
        .settings-input { width: 100%; padding: 6px; font-size: 11px; margin-top: 5px; }
        
        .toggle-btn {
            background: #4299e1; color: white; border: none; padding: 8px;
            border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px;
        }
        .toggle-btn.secondary { background: #718096; }
        .toggle-btn:hover { opacity: 0.9; }
        .checkbox-label { font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer; }
        input[type="range"] { width: 100%; cursor: pointer; }
        
        .company-list, .investor-list { display: flex; flex-direction: column; gap: 8px; margin-top: 5px; max-height: 180px; overflow-y: auto; padding-right: 5px;}
        .list-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .list-row input[type="text"] { flex: 1; min-width: 0; padding: 4px 6px; font-size: 11px; }
        .list-row img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-color); flex-shrink: 0;}
        .list-row .avatar-placeholder { width: 24px; height: 24px; border-radius: 50%; background: #ccc; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #333; flex-shrink: 0;}

        /* --- BOTÓN DE ALERTA --- */
        .btn-alert {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 4px;
            padding: 4px 0;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            width: 100%;
            text-align: center;
            color: var(--text-muted);
            min-height: 26px; /* Para que no se achique cuando está vacío */
        }
        .btn-alert.active {
            background: rgba(255, 193, 7, 0.2);
            border-color: #ffc107;
            color: var(--text-main);
            font-weight: bold;
        }

        /* --- MARCA DE AGUA Y LOGO FLOTANTE --- */
        .brand-container {
            position: fixed; 
            bottom: 25px; 
            right: 25px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            z-index: 100;
            pointer-events: none;
        }
        
        .brand-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--card-bg);
            border: var(--glass-border);
            padding: 4px 12px 4px 4px;
            border-radius: 50px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
        }

        .brand-logo img {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            object-fit: cover;
            background-color: var(--input-bg);
        }

        .brand-logo span {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .watermark {
            font-size: 12px;
            color: var(--text-muted);
            opacity: 0.8;
            font-weight: 500;
        }
        .watermark a { color: inherit; text-decoration: none; font-weight: bold; }
        .watermark a:hover { text-decoration: underline; opacity: 1; }
    </style>
</head>
<body>

    <div class="container layout-side" id="main-container">
        <!-- Panel Tabla -->
        <div class="panel-tabla glass-panel" id="panel-tabla">
            <div class="panel-header">
                <div class="header-tools">
                    <button class="icon-btn" onclick="setLayout('side')" title="Lado a lado">↔️</button>
                    <button class="icon-btn" onclick="setLayout('bottom')" title="Tabla abajo">⬇️</button>
                    <button class="icon-btn" onclick="setLayout('top')" title="Tabla arriba">⬆️</button>
                    <button class="icon-btn" onclick="setLayout('hidden')" title="Ocultar tabla">▶️</button>
                    <button class="icon-btn" onclick="toggleTableSettings()" title="Configurar columnas">⚙️</button>
                </div>
                <h2>Empresas</h2>
                
                <!-- Menú de opciones de la tabla -->
                <div class="dropdown-menu" id="table-settings-menu">
                    <span style="font-weight:bold; font-size:11px; color:var(--text-muted);">Mostrar columnas:</span>
                    <!-- Se genera con JS -->
                </div>
            </div>
            <div class="table-container">
                <table id="tabla-datos">
                    <thead>
                        <tr id="table-headers"></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <button class="btn-add" onclick="agregarFila()">+ Añadir Cuenta</button>
        </div>

        <!-- Panel Gráfico -->
        <div class="panel-grafico glass-panel" id="panel-grafico-export">
            <div class="datetime-display" id="datetime-display"></div>

            <div class="panel-header">
                <div style="width: 120px;"></div>
                <h2>Gráfico</h2>
                <div class="header-tools">
                    <button class="icon-btn" onclick="exportChart()" title="Descargar Imagen">📸</button>
                    <button class="icon-btn" onclick="toggleChartSettings()" title="Configurar">⚙️</button>
                </div>
                
                <!-- Menú de opciones del gráfico -->
                <div class="dropdown-menu" id="chart-settings-menu">
                    <span style="font-weight:bold; font-size:11px; color:var(--text-muted);">Mostrar en las barras:</span>
                    <select id="bar-val-display" onchange="cambiarBarValueDisplay(this.value)" style="width:100%; padding:4px; margin-bottom: 10px;">
                        <option value="pct">Porcentaje (%)</option>
                        <option value="usd">Dólares (USD)</option>
                        <option value="both">Ambos</option>
                    </select>

                    <span style="font-weight:bold; font-size:11px; color:var(--text-muted);">Mostrar textos debajo:</span>
                    <label><input type="checkbox" id="chk-investor" checked onchange="toggleChartLabel('investor', this.checked)"> Inversor (Avatar)</label>
                    <label><input type="checkbox" id="chk-alert" checked onchange="toggleChartLabel('alert', this.checked)"> Alerta ⏰</label>
                    <label><input type="checkbox" id="chk-name" checked onchange="toggleChartLabel('name', this.checked)"> Empresa</label>
                    <label><input type="checkbox" id="chk-capital" checked onchange="toggleChartLabel('capital', this.checked)"> Capital</label>
                    <label><input type="checkbox" id="chk-cost" checked onchange="toggleChartLabel('cost', this.checked)"> Costo</label>
                    <label><input type="checkbox" id="chk-risk" checked onchange="toggleChartLabel('risk', this.checked)"> Riesgo (%)</label>
                    <label><input type="checkbox" id="chk-risk-usd" checked onchange="toggleChartLabel('risk_usd', this.checked)"> Riesgo USD</label>
                    <label><input type="checkbox" id="chk-status" checked onchange="toggleChartLabel('status', this.checked)"> Estado</label>
                    <label><input type="checkbox" id="chk-date" checked onchange="toggleChartLabel('date', this.checked)"> Fecha</label>
                    <label><input type="checkbox" id="chk-url" checked onchange="toggleChartLabel('url', this.checked)"> URL</label>
                    <label><input type="checkbox" id="chk-notes" checked onchange="toggleChartLabel('notes', this.checked)"> Notas</label>
                    
                    <hr>
                    <label style="flex-direction: column; align-items: flex-start; gap: 5px;">
                        <span>Tamaño de letra: <span id="font-size-val">11</span>px</span>
                        <input type="range" id="font-size-slider" min="8" max="20" value="11" oninput="cambiarFontSize(this.value)">
                    </label>
                    <label style="flex-direction: column; align-items: flex-start; gap: 5px;">
                        <span>Separación de barras:</span>
                        <input type="range" id="gap-slider" min="5" max="80" value="25" oninput="cambiarGapBarras(this.value)">
                    </label>
                </div>
            </div>
            <div class="chart-layout">
                <div class="y-axis" id="y-axis"></div>
                <div class="charts-wrapper" id="chart-area">
                    <div class="global-zero-line" id="global-zero-line"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Botón flotante para recuperar panel izquierdo -->
    <button class="btn-float-open" onclick="setLayout('side')" title="Mostrar Panel">↔️</button>

    <!-- Botones Flotantes Globales -->
    <button class="management-btn" onclick="toggleManagementPanel()" title="Gestionar Empresas e Inversores">➕</button>
    <button class="settings-btn" onclick="toggleGlobalSettings()" title="Ajustes Visuales">⚙️</button>
    
    <!-- Panel de Gestión de Datos -->
    <div class="management-panel" id="management-panel">
        <label style="margin-top:5px;">Empresas:</label>
        <div class="company-list" id="company-list"></div>
        <div style="display:flex; gap:5px; margin-top:5px;">
            <input type="text" id="new-company-name" class="settings-input" placeholder="Nueva empresa" style="margin-top:0;">
            <input type="color" id="new-company-color" value="#4299e1" style="width:30px; height:28px; padding:0; border:none;">
            <button class="toggle-btn" onclick="agregarEmpresa()" style="padding:4px 8px;">+</button>
        </div>

        <hr style="width:100%; border:0; border-top:1px solid var(--border-color); margin: 10px 0;">
        
        <label>Inversores:</label>
        <div class="investor-list" id="investor-list"></div>
        <div style="display:flex; gap:5px; margin-top:5px; flex-wrap: wrap;">
            <input type="text" id="new-investor-name" class="settings-input" placeholder="Nombre" style="margin-top:0; flex:1;">
            <input type="file" id="new-investor-avatar" accept="image/*" style="display:none;" onchange="previewAvatar(event)">
            <button class="toggle-btn secondary" onclick="document.getElementById('new-investor-avatar').click()" style="padding:4px 8px;">Foto</button>
            <img id="avatar-preview" src="" style="width:28px; height:28px; border-radius:50%; display:none; object-fit:cover; border:1px solid #ccc;">
            <button class="toggle-btn" onclick="agregarInversor()" style="padding:4px 8px;">+</button>
        </div>

        <hr style="width:100%; border:0; border-top:1px solid var(--border-color); margin: 10px 0;">
        
        <label style="color: #4299e1;">Copia de Seguridad (Backup):</label>

    <script>
        // --- COLUMNAS ---
        const columnasDef = [
            { key: 'visible', label: '👁' },
            { key: 'name', label: 'Empresa' },
            { key: 'investor', label: 'Inversor' },
            { key: 'capital', label: 'Capital' },
            { key: 'cost', label: 'Costo' },
            { key: 'risk', label: 'Riesgo' }, 
            { key: 'risk_usd', label: 'Riesgo USD' }, 
            { key: 'startDate', label: 'Inicio' },
            { key: 'modality', label: 'Modalidad' },
            { key: 'status', label: 'Estado' },
            { key: 'actual', label: 'Actual' },
            { key: 'min', label: 'Mín' },
            { key: 'max', label: 'Obj' },
            { key: 'url', label: 'URL' },
            { key: 'notes', label: 'Notas' },
            { key: 'alert', label: 'Alerta' }, 
            { key: 'actions', label: '' }
        ];

        let columnOrder = JSON.parse(localStorage.getItem('columnOrder')) || ['visible', 'name', 'investor', 'capital', 'cost', 'risk', 'risk_usd', 'startDate', 'modality', 'status', 'actual', 'min', 'max', 'url', 'notes', 'alert', 'actions'];
        columnOrder = columnOrder.filter(k => columnasDef.find(c => c.key === k));
        columnasDef.forEach(c => { if(!columnOrder.includes(c.key)) columnOrder.push(c.key); });
        
        let visibleCols = JSON.parse(localStorage.getItem('visibleCols')) || ['visible', 'name', 'investor', 'capital', 'cost', 'risk', 'risk_usd', 'startDate', 'modality', 'status', 'actual', 'min', 'max', 'url', 'notes', 'alert', 'actions'];

        // --- DATOS ---
        let cuentas = JSON.parse(localStorage.getItem('misCuentasPro')) || [
            { visible: true, name: "FTMO", investor: "Andrés", capital: 100000, cost: -510, risk: 1.25, startDate: "01/09/2024", modality: "Examen", status: "En curso ⏳", actual: -9.4, min: -10, max: 10, notes: "Fase 1/2", url: "", alert: "" },
            { visible: true, name: "FTMO", investor: "Lucía", capital: 25000, cost: -250, risk: 1.25, startDate: "02/10/2024", modality: "Examen", status: "Aprobado ✅", actual: 10.0, min: -10, max: 10, notes: "Fase 1/2", url: "https://www.myfxbook.com", alert: "⏰" },
            { visible: true, name: "Bullfy", investor: "Andrés", capital: 5000, cost: -100, risk: 1.0, startDate: "10/10/2026", modality: "Mixto", status: "Desaprobado ❌", actual: -3.0, min: -4, max: 8, notes: "Fase Única", url: "", alert: "" },
            { visible: true, name: "Axi", investor: "Lucía", capital: 10000, cost: 0, risk: 1.0, startDate: "15/11/2026", modality: "Capital propio", status: "En curso ⏳", actual: 2.5, min: null, max: null, notes: "Ahorros", url: "", alert: "" }
        ];

        let empresas = JSON.parse(localStorage.getItem('misEmpresas'));
        if (!empresas || empresas.length === 0) {
            empresas = [
                { name: "FTMO", color: "#3182ce" },
                { name: "Darwinex", color: "#4a5568" },
                { name: "Axi", color: "#e53e3e" },
                { name: "Bullfy", color: "#dd6b20" }
            ];
        }

        let inversores = JSON.parse(localStorage.getItem('misInversores'));
        if (!inversores || inversores.length === 0) {
            inversores = [
                { name: "Andrés", avatar: "" },
                { name: "Lucía", avatar: "" }
            ];
        }

        let colores = JSON.parse(localStorage.getItem('misColores')) || { 
            pos: "#38a169", neg: "#e53e3e", 
            passed: "#a3e635", failed: "#7f1d1d",
            ownPos: "#3b82f6", ownNeg: "#ec4899",
            modExamen: "#2d3748", modPropio: "#fefcbf", modMixto: "#e9d8fd"
        };

        let chartLabels = JSON.parse(localStorage.getItem('chartLabels')) || {
            investor: true, name: true, capital: true, cost: true, risk: true, risk_usd: true, status: true, date: true, url: true, notes: true, alert: true
        };

        let barValueDisplay = localStorage.getItem('barValueDisplay') || 'pct'; 

        let isDarkMode = localStorage.getItem('darkMode') === 'true';
        let savedBgImage = localStorage.getItem('bgImage') || 'https://raw.githubusercontent.com/aandresfx/portafolio/982689e9cb64e93a4624b0eaca9f3e0a1b6e6190/Fondo.jpg';
        let overlayOpacity = parseInt(localStorage.getItem('overlayOpacity') || 50);
        let barGap = parseInt(localStorage.getItem('barGap') || 25);
        let chartFontSize = parseInt(localStorage.getItem('chartFontSize') || 11);
        
        let currentSort = { key: null, dir: 'asc' };
        let isDraggingColumn = false;
        let currentLayout = localStorage.getItem('layoutState') || 'side';
        let tempAvatarBase64 = "";

        // Inicializar UI
        function initUI() {
            document.getElementById('color-pos').value = colores.pos;
            document.getElementById('color-neg').value = colores.neg;
            document.getElementById('color-passed').value = colores.passed;
            document.getElementById('color-failed').value = colores.failed;
            document.getElementById('color-own-pos').value = colores.ownPos;
            document.getElementById('color-own-neg').value = colores.ownNeg;
            document.getElementById('color-mod-examen').value = colores.modExamen;
            document.getElementById('color-mod-propio').value = colores.modPropio;
            document.getElementById('color-mod-mixto').value = colores.modMixto;

            document.getElementById('bar-val-display').value = barValueDisplay;
            document.getElementById('chk-investor').checked = chartLabels.investor;
            document.getElementById('chk-alert').checked = chartLabels.alert;
            document.getElementById('chk-name').checked = chartLabels.name;
            document.getElementById('chk-capital').checked = chartLabels.capital;
            document.getElementById('chk-cost').checked = chartLabels.cost;
            document.getElementById('chk-risk').checked = chartLabels.risk;
            document.getElementById('chk-risk-usd').checked = chartLabels.risk_usd;
            document.getElementById('chk-status').checked = chartLabels.status;
            document.getElementById('chk-date').checked = chartLabels.date;
            document.getElementById('chk-url').checked = chartLabels.url;
            document.getElementById('chk-notes').checked = chartLabels.notes;

            document.getElementById('gap-slider').value = barGap;
            document.documentElement.style.setProperty('--bar-gap', barGap + 'px');
            
            document.getElementById('font-size-slider').value = chartFontSize;
            document.getElementById('font-size-val').innerText = chartFontSize;
            document.documentElement.style.setProperty('--chart-label-size', chartFontSize + 'px');

            document.getElementById('bg-opacity').value = overlayOpacity;
            document.getElementById('opacity-val').innerText = overlayOpacity;
            
            if(isDarkMode) document.body.classList.add('dark-mode');
            if(savedBgImage !== 'none') document.getElementById('bg-url-input').value = savedBgImage.startsWith('data:') ? '(Imagen local cargada)' : savedBgImage;

            setLayout(currentLayout);
            renderCompanyList();
            renderInvestorList();
            renderTableSettings();
        }
        initUI();

        // --- LAYOUTS ---
        function setLayout(mode) {
            currentLayout = mode;
            document.getElementById('main-container').className = `container layout-${mode}`;
            localStorage.setItem('layoutState', mode);
        }

        // --- RELOJ EN VIVO ---
        function updateClock() {
            const now = new Date();
            const optionsDate = { weekday: 'long', day: 'numeric', month: 'long' };
            const dateStr = now.toLocaleDateString('es-ES', optionsDate);
            const timeStr = now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('datetime-display').innerText = `${dateStr} ${timeStr} hs`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function updateBackground() {
            let rgb = isDarkMode ? '26, 32, 44' : '255, 255, 255';
            let op = overlayOpacity / 100;
            let url = savedBgImage === 'none' ? 'none' : `url('${savedBgImage}')`;
            if (savedBgImage === 'none') document.body.style.backgroundImage = 'none';
            else document.body.style.backgroundImage = `linear-gradient(rgba(${rgb}, ${op}), rgba(${rgb}, ${op})), ${url}`;
            document.body.style.backgroundColor = isDarkMode ? '#1a202c' : '#e0e5ec';
        }
        updateBackground();

        // --- UTILIDADES ---
        function getCurrencyStr(num) {
            if(num === null || num === undefined || num === '') return '';
            let n = Number(num);
            if(n < 0) return '-$' + Math.abs(n).toLocaleString('es-AR', {maximumFractionDigits: 0});
            return '$' + n.toLocaleString('es-AR', {maximumFractionDigits: 0});
        }
        function getCostStr(num) {
            if(num === null || num === undefined || num === '') return '';
            let n = Number(num);
            if(n === 0) return '$0';
            return '-$' + Math.abs(n).toLocaleString('es-AR');
        }
        function parseCurrency(str) {
            if(!str) return '';
            let num = str.toString().replace(/[^\d-]/g, '');
            return num ? parseInt(num, 10) : '';
        }
        function getPercentStr(num, decimals) {
            if(num === null || num === undefined || num === '') return '';
            return Number(num).toFixed(decimals) + '%';
        }
        function parsePercent(str) {
            if(!str) return '';
            let num = str.toString().replace(',', '.').replace(/[^\d.-]/g, '');
            return num ? parseFloat(num) : '';
        }
        function formatDate(input) {
            let val = input.value.replace(/\D/g, '');
            if (val.length > 2 && val.length <= 4) val = val.substring(0, 2) + '/' + val.substring(2);
            else if (val.length > 4) val = val.substring(0, 2) + '/' + val.substring(2, 4) + '/' + val.substring(4, 8);
            input.value = val;
        }
        function parseDate(dateStr) {
            if(!dateStr) return new Date(0);
            const parts = dateStr.split('/');
            if(parts.length === 3) return new Date(parts[2], parts[1]-1, parts[0]);
            return new Date(dateStr);
        }

        function formatMonthYear(dateStr) {
            if(!dateStr) return '';
            const parts = dateStr.split('/');
            if(parts.length === 3) {
                const months = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
                const month = parseInt(parts[1], 10) - 1;
                if(month >= 0 && month < 12) {
                    return `${months[month]} ${parts[2]}`;
                }
            }
            return dateStr; 
        }

        function getContrastColor(hexcolor) {
            if(!hexcolor) return '#ffffff';
            if(hexcolor.indexOf('#') !== 0) return '#ffffff';
            let r = parseInt(hexcolor.substr(1, 2), 16);
            let g = parseInt(hexcolor.substr(3, 2), 16);
            let b = parseInt(hexcolor.substr(5, 2), 16);
            let yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
            return (yiq >= 128) ? '#000000' : '#ffffff';
        }

        function getModColor(mod) {
            if(mod === 'Examen') return colores.modExamen;
            if(mod === 'Capital propio') return colores.modPropio;
            if(mod === 'Mixto') return colores.modMixto;
            return '#ffffff';
        }

        function getAccountColor(cuenta) {
            const isPropio = cuenta.modality === 'Capital propio';
            let displayValue = Number(cuenta.actual) || 0;
            let color = colores.pos;

            if (cuenta.status.includes('Desaprobado') && !isPropio) {
                color = colores.failed;
            } else if (cuenta.status.includes('Aprobado') && !isPropio) {
                color = colores.passed;
            } else if (isPropio) {
                color = displayValue >= 0 ? colores.ownPos : colores.ownNeg;
            } else {
                color = displayValue >= 0 ? colores.pos : colores.neg;
            }
            return color;
        }

        // --- BACKUP & RESTORE ---
        function exportarDatos() {
            const backup = {};
            const keys = [
                'misCuentasPro', 'misEmpresas', 'misInversores', 'misColores', 
                'chartLabels', 'barValueDisplay', 'darkMode', 'bgImage', 
                'overlayOpacity', 'barGap', 'chartFontSize', 'columnOrder', 
                'visibleCols', 'layoutState'
            ];

            keys.forEach(key => {
                const item = localStorage.getItem(key);
                if (item !== null) {
                    backup[key] = item; 
                }
            });

            const dataStr = JSON.stringify(backup, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `Portafolio_Backup_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importarDatos(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    
                    for (const key in data) {
                        if (data.hasOwnProperty(key)) {
                            localStorage.setItem(key, data[key]);
                        }
                    }
                    
                    alert("¡Datos importados con éxito! La página se recargará para aplicar los cambios.");
                    location.reload();
                    
                } catch (error) {
                    console.error(error);
                    alert("Error al leer el archivo. Asegúrate de que sea un archivo de backup válido (.json).");
                }
            };
            reader.readAsText(file);
        }

        // --- RENDERIZADO ---
        function renderTabla() {
            const theadTr = document.getElementById('table-headers');
            const tbody = document.querySelector('#tabla-datos tbody');
            theadTr.innerHTML = '';
            
            const activeColumns = columnOrder.filter(k => visibleCols.includes(k));
            
            activeColumns.forEach(key => {
                const colDef = columnasDef.find(c => c.key === key);
                const th = document.createElement('th');
                th.dataset.key = key;

                let sortIcon = '';
                if (currentSort.key === key) {
                    sortIcon = currentSort.dir === 'asc' ? ' ⬆' : ' ⬇';
                } else {
                    sortIcon = ' ⇅';
                }

                if (key === 'visible') {
                    const isAllVisible = cuentas.every(c => c.visible !== false);
                    th.innerHTML = `<input type="checkbox" class="in-check" ${isAllVisible ? 'checked' : ''} onchange="toggleAllVisibility(this.checked)" title="Mostrar/Ocultar todas">`;
                } else if (key === 'actions') {
                    th.innerText = '';
                } else {
                    th.innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center; width:100%; pointer-events:none;">
                        ${colDef.label} <span style="font-size: 8px; opacity: 0.5;">${sortIcon}</span>
                    </div>`;
                    th.onclick = (e) => {
                        if (!isDraggingColumn && e.target.tagName !== 'INPUT') {
                            sortTable(key);
                        }
                    };
                }
                theadTr.appendChild(th);
            });

            tbody.innerHTML = '';
            cuentas.forEach((cuenta, index) => {
                const tr = document.createElement('tr');
                activeColumns.forEach(key => {
                    const td = document.createElement('td');
                    const isPropio = cuenta.modality === 'Capital propio';

                    switch(key) {
                        case 'visible':
                            td.innerHTML = `<input type="checkbox" class="in-check" ${cuenta.visible !== false ? 'checked' : ''} onchange="actualizarDato(${index}, 'visible', this.checked); const isAllVisible = cuentas.every(c => c.visible !== false); document.querySelector('#table-headers input[type=\\'checkbox\\']').checked = isAllVisible;">`;
                            break;
                        case 'name':
                            let optionsHTML = empresas.map(e => `<option value="${e.name}" ${cuenta.name === e.name ? 'selected' : ''}>${e.name}</option>`).join('');
                            if(!empresas.find(e => e.name === cuenta.name)) {
                                optionsHTML += `<option value="${cuenta.name}" selected>${cuenta.name}</option>`;
                            }
                            const empColor = empresas.find(e => e.name === cuenta.name)?.color || 'transparent';
                            td.innerHTML = `<select class="in-name" style="background-color: ${empColor}; color: ${getContrastColor(empColor)};" onchange="actualizarDato(${index}, 'name', this.value); const c = empresas.find(e => e.name === this.value)?.color || 'transparent'; this.style.backgroundColor = c; this.style.color = getContrastColor(c);">${optionsHTML}</select>`;
                            break;
                        case 'investor':
                            let invOptions = `<option value="">--</option>` + inversores.map(inv => `<option value="${inv.name}" ${cuenta.investor === inv.name ? 'selected' : ''}>${inv.name}</option>`).join('');
                            if(cuenta.investor && !inversores.find(i => i.name === cuenta.investor)) {
                                invOptions += `<option value="${cuenta.investor}" selected>${cuenta.investor}</option>`;
                            }
                            td.innerHTML = `<select class="in-investor" onchange="actualizarDato(${index}, 'investor', this.value)">${invOptions}</select>`;
                            break;
                        case 'capital':
                            td.innerHTML = `<input type="text" class="in-cap" value="${getCurrencyStr(cuenta.capital)}" onfocus="this.value = parseCurrency(this.value) || ''; this.select()" onblur="this.value = getCurrencyStr(parseCurrency(this.value)); actualizarDato(${index}, 'capital', parseCurrency(this.value))" onkeydown="if(event.key==='Enter') this.blur()">`;
                            break;
                        case 'cost':
                            td.innerHTML = `<input type="text" class="in-cost" value="${getCostStr(cuenta.cost)}" onfocus="this.value = parseCurrency(this.value) || ''; this.select()" onblur="this.value = getCostStr(parseCurrency(this.value)); actualizarDato(${index}, 'cost', parseCurrency(this.value))" onkeydown="if(event.key==='Enter') this.blur()" placeholder="-$">`;
                            break;
                        case 'risk':
                            td.innerHTML = `<input type="text" class="in-risk" value="${getPercentStr(cuenta.risk, 2)}" onfocus="this.value = parsePercent(this.value) || ''; this.select()" onblur="this.value = getPercentStr(parsePercent(this.value), 2); actualizarDato(${index}, 'risk', parsePercent(this.value))" onkeydown="if(event.key==='Enter') this.blur()">`;
                            break;
                        case 'risk_usd':
                            let usdVal = (Number(cuenta.capital) || 0) * (Number(cuenta.risk) || 0) / 100;
                            td.innerHTML = `<input type="text" class="in-risk-usd" style="color:var(--text-muted); font-weight:bold; background:transparent; border:none; box-shadow:none;" readonly value="${getCurrencyStr(usdVal)}">`;
                            break;
                        case 'startDate':
                            const dateBg = isDarkMode ? '#e2e8f0' : '#2d3748';
                            const dateColor = isDarkMode ? '#1a202c' : '#f7fafc';
                            td.innerHTML = `<input type="text" class="in-date" style="background-color: ${dateBg}; color: ${dateColor};" value="${cuenta.startDate}" onfocus="this.select()" oninput="formatDate(this)" onchange="actualizarDato(${index}, 'startDate', this.value)" placeholder="DD/MM/AAAA">`;
                            break;
                        case 'modality':
                            const modBg = getModColor(cuenta.modality);
                            td.innerHTML = `<select class="in-mod" style="background-color: ${modBg}; color: ${getContrastColor(modBg)};" onchange="cambiarModalidad(${index}, this.value)">
                                <option value="Examen" ${cuenta.modality === 'Examen' ? 'selected' : ''}>Examen</option>
                                <option value="Capital propio" ${cuenta.modality === 'Capital propio' ? 'selected' : ''}>Capital propio</option>
                                <option value="Mixto" ${cuenta.modality === 'Mixto' ? 'selected' : ''}>Mixto</option>
                            </select>`;
                            break;
                        case 'status':
                            td.innerHTML = `<select class="in-status" onchange="actualizarDato(${index}, 'status', this.value)">
                                <option value="En curso ⏳" ${cuenta.status === 'En curso ⏳' ? 'selected' : ''}>En curso ⏳</option>
                                <option value="Aprobado ✅" ${cuenta.status === 'Aprobado ✅' ? 'selected' : ''}>Aprobado ✅</option>
                                <option value="Desaprobado ❌" ${cuenta.status === 'Desaprobado ❌' ? 'selected' : ''}>Desaprobado ❌</option>
                            </select>`;
                            break;
                        case 'actual':
                            const actBg = getAccountColor(cuenta);
                            const actColor = getContrastColor(actBg);
                            td.innerHTML = `<input type="text" class="in-num" style="background-color: ${actBg}; color: ${actColor}; font-weight: bold;" value="${getPercentStr(cuenta.actual, 1)}" onfocus="this.value = parsePercent(this.value) || ''; this.select()" onblur="this.value = getPercentStr(parsePercent(this.value), 1); actualizarDato(${index}, 'actual', parsePercent(this.value)); const c = getAccountColor(cuentas[${index}]); this.style.backgroundColor = c; this.style.color = getContrastColor(c);" onkeydown="if(event.key==='Enter') this.blur()">`;
                            break;
                        case 'min':
                            if (isPropio) {
                                td.innerHTML = '';
                                td.style.borderBottom = '1px solid transparent';
                            } else {
                                td.innerHTML = `<input type="text" class="in-num" value="${getPercentStr(cuenta.min, 0)}" onfocus="this.value = parsePercent(this.value) || ''; this.select()" onblur="this.value = getPercentStr(parsePercent(this.value), 0); actualizarDato(${index}, 'min', parsePercent(this.value))" onkeydown="if(event.key==='Enter') this.blur()">`;
                            }
                            break;
                        case 'max':
                            if (isPropio) {
                                td.innerHTML = '';
                                td.style.borderBottom = '1px solid transparent';
                            } else {
                                td.innerHTML = `<input type="text" class="in-num" value="${getPercentStr(cuenta.max, 0)}" onfocus="this.value = parsePercent(this.value) || ''; this.select()" onblur="this.value = getPercentStr(parsePercent(this.value), 0); actualizarDato(${index}, 'max', parsePercent(this.value))" onkeydown="if(event.key==='Enter') this.blur()">`;
                            }
                            break;
                        case 'url':
                            td.innerHTML = `<input type="url" class="in-url" value="${cuenta.url || ''}" onfocus="this.select()" onchange="actualizarDato(${index}, 'url', this.value)" placeholder="https://...">`;
                            break;
                        case 'notes':
                            td.innerHTML = `<input type="text" class="in-notes" value="${cuenta.notes || ''}" onfocus="this.select()" onchange="actualizarDato(${index}, 'notes', this.value)" placeholder="...">`;
                            break;
                        case 'alert':
                            td.innerHTML = `<button id="btn-alert-${index}" class="btn-alert ${cuenta.alert ? 'active' : ''}" onclick="toggleAlerta(${index})" title="Activar/Desactivar Alerta">${cuenta.alert || ''}</button>`;
                            break;
                        case 'actions':
                            td.innerHTML = `<button class="btn-delete" onclick="eliminarCuenta(${index})" title="Eliminar cuenta">🗑️</button>`;
                            break;
                    }
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });

            if(!window.sortableInitialized) {
                new Sortable(theadTr, {
                    animation: 150,
                    onStart: function() { isDraggingColumn = true; },
                    onEnd: function (evt) {
                        const newOrder = Array.from(theadTr.children).map(th => th.dataset.key);
                        const hiddenCols = columnOrder.filter(k => !newOrder.includes(k));
                        columnOrder = [...newOrder, ...hiddenCols];
                        
                        localStorage.setItem('columnOrder', JSON.stringify(columnOrder));
                        renderTabla(); 
                        setTimeout(() => { isDraggingColumn = false; }, 100);
                    }
                });
                window.sortableInitialized = true;
            }
        }

        function sortTable(key) {
            if (currentSort.key === key) {
                currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort.key = key;
                currentSort.dir = 'asc';
            }

            cuentas.sort((a, b) => {
                let valA = a[key];
                let valB = b[key];

                if (valA === null || valA === undefined) valA = '';
                if (valB === null || valB === undefined) valB = '';

                if (['capital', 'cost', 'actual', 'min', 'max', 'risk', 'risk_usd'].includes(key)) {
                    valA = Number(valA) || 0;
                    valB = Number(valB) || 0;
                } else if (key === 'startDate') {
                    valA = parseDate(valA);
                    valB = parseDate(valB);
                } else {
                    valA = valA.toString().toLowerCase();
                    valB = valB.toString().toLowerCase();
                }

                if (valA < valB) return currentSort.dir === 'asc' ? -1 : 1;
                if (valA > valB) return currentSort.dir === 'asc' ? 1 : -1;
                return 0;
            });

            renderTabla();
        }

        function renderGrafico() {
            const chartArea = document.getElementById('chart-area');
            const yAxis = document.getElementById('y-axis');
            
            chartArea.innerHTML = '<div class="global-zero-line" id="global-zero-line"></div>';
            yAxis.innerHTML = '';

            const cuentasVisibles = cuentas.filter(c => c.visible !== false);
            cuentasVisibles.sort((a, b) => parseDate(a.startDate) - parseDate(b.startDate));

            let maxAbs = 10; 
            cuentasVisibles.forEach(c => {
                if(c.modality !== 'Capital propio') {
                    const valMin = Math.abs(Number(c.min) || 0);
                    const valMax = Math.abs(Number(c.max) || 0);
                    if (valMin > maxAbs) maxAbs = valMin;
                    if (valMax > maxAbs) maxAbs = valMax;
                }
            });

            const globalMax = Math.ceil(maxAbs / 5) * 5;
            const globalMin = -globalMax;
            const rangeGlobal = globalMax - globalMin;
            const zeroBottomPercent = 50; 

            const step = rangeGlobal > 30 ? 10 : 5;
            for (let i = globalMin; i <= globalMax; i += step) {
                const topPercent = 100 - (((i - globalMin) / rangeGlobal) * 100);
                const tick = document.createElement('div');
                tick.className = 'y-tick';
                tick.style.top = `${topPercent}%`;
                tick.innerText = `${i}%`;
                yAxis.appendChild(tick);
            }

            document.getElementById('global-zero-line').style.top = `190px`;

            cuentasVisibles.forEach(cuenta => {
                const column = document.createElement('div');
                column.className = 'chart-column';
                const isPropio = cuenta.modality === 'Capital propio';
                
                let displayValue = Number(cuenta.actual) || 0;
                let color = getAccountColor(cuenta);
                
                const textColor = getContrastColor(color);
                const pctStr = displayValue > 0 ? `+${displayValue.toFixed(1)}%` : `${displayValue.toFixed(1)}%`;
                const usdVal = ((Number(cuenta.capital) || 0) * displayValue) / 100;
                const usdStr = getCurrencyStr(usdVal);

                let textoValor = '';
                if (barValueDisplay === 'pct') {
                    textoValor = pctStr;
                } else if (barValueDisplay === 'usd') {
                    textoValor = usdStr;
                } else {
                    textoValor = `${pctStr}<br><span style="font-size:0.85em; opacity:0.8;">${usdStr}</span>`;
                }

                let rangeHeightPercent = 0;
                let rangeBottomPercent = 0;
                if(!isPropio && cuenta.min !== '' && cuenta.max !== '') {
                    rangeHeightPercent = ((Number(cuenta.max) - Number(cuenta.min)) / rangeGlobal) * 100;
                    rangeBottomPercent = ((Number(cuenta.min) - globalMin) / rangeGlobal) * 100;
                }

                let fillHeightPercent = (Math.abs(displayValue) / rangeGlobal) * 100;
                let fillBottomPercent = zeroBottomPercent;
                if (displayValue < 0) fillBottomPercent = zeroBottomPercent - fillHeightPercent;
                if (displayValue === 0) fillHeightPercent = 0;

                let targetHTML = (!isPropio && cuenta.max !== '' && cuenta.max !== null) ? `<div class="target-text">${Number(cuenta.max).toFixed(0)}%</div>` : '';
                
                let avatarHTML = '';
                if(chartLabels.investor && cuenta.investor) {
                    const inv = inversores.find(i => i.name === cuenta.investor);
                    if (inv && inv.avatar) {
                        avatarHTML = `<div class="avatar-container"><img src="${inv.avatar}" alt="${inv.name}"></div>`;
                    } else {
                        const initial = cuenta.investor.charAt(0).toUpperCase();
                        avatarHTML = `<div class="avatar-container" title="${cuenta.investor}">${initial}</div>`;
                    }
                }

                let labelsHTML = '';
                if (chartLabels.name) {
                    const empColor = empresas.find(e => e.name === cuenta.name)?.color || 'var(--text-main)';
                    const empTextColor = getContrastColor(empColor);
                    labelsHTML += `<div class="name-text" style="background-color: ${empColor}; color: ${empTextColor};">${cuenta.name}</div>`;
                }
                if (chartLabels.alert && cuenta.alert) {
                    labelsHTML += `<div class="alert-text">${cuenta.alert}</div>`;
                }
                if (chartLabels.capital) labelsHTML += `<div class="cap-text">${getCurrencyStr(cuenta.capital)}</div>`;
                if (chartLabels.cost && cuenta.cost !== 0) labelsHTML += `<div class="cost-text">${getCostStr(cuenta.cost)}</div>`;
                
                if (chartLabels.risk && cuenta.risk) {
                    labelsHTML += `<div class="risk-text">R: ${getPercentStr(cuenta.risk, 2)}</div>`;
                }
                if (chartLabels.risk_usd && cuenta.risk) {
                    let riskUsdVal = (Number(cuenta.capital) || 0) * (Number(cuenta.risk) || 0) / 100;
                    labelsHTML += `<div class="risk-text">R: ${getCurrencyStr(riskUsdVal)}</div>`;
                }

                if (chartLabels.status) labelsHTML += `<div class="status-text">${cuenta.status || ''}</div>`;
                if (chartLabels.date) labelsHTML += `<div class="date-text">${formatMonthYear(cuenta.startDate)}</div>`; 
                if (chartLabels.url && cuenta.url && cuenta.url.trim() !== '') labelsHTML += `<a href="${cuenta.url}" target="_blank" class="audit-link">Auditoría</a>`;
                if (chartLabels.notes) labelsHTML += `<div class="notes-text">${cuenta.notes || ''}</div>`;

                column.innerHTML = `
                    <div class="bar-container">
                        ${avatarHTML}
                        ${!isPropio ? `<div class="bar-range-bg" style="bottom: ${rangeBottomPercent}%; height: ${rangeHeightPercent}%;">${targetHTML}</div>` : ''}
                        <div class="bar-fill" style="bottom: ${fillBottomPercent}%; height: ${fillHeightPercent}%; background-color: ${color};">
                            <span class="val-text" style="color: ${textColor};">${textoValor}</span>
                        </div>
                    </div>
                    <div class="labels-area">${labelsHTML}</div>
                `;
                chartArea.appendChild(column);
            });
        }

        // --- EXPORTAR IMAGEN (PANTALLA COMPLETA) ---
        function exportChart() {
            const body = document.body;
            const panels = document.querySelectorAll('.glass-panel');

            const originalBgAttachment = body.style.backgroundAttachment;
            const originalBackdrops = Array.from(panels).map(p => p.style.backdropFilter);
            const originalWebkitBackdrops = Array.from(panels).map(p => p.style.webkitBackdropFilter);

            body.style.backgroundAttachment = 'scroll'; 
            
            panels.forEach(p => {
                p.style.backdropFilter = 'none';
                p.style.webkitBackdropFilter = 'none';
            });

            const bgColor = isDarkMode ? '#1a202c' : '#e0e5ec';

            html2canvas(body, { 
                scale: 2,
                backgroundColor: bgColor,
                useCORS: true,
                scrollX: 0,
                scrollY: 0
            }).then(canvas => {
                body.style.backgroundAttachment = originalBgAttachment;
                panels.forEach((p, i) => {
                    p.style.backdropFilter = originalBackdrops[i];
                    p.style.webkitBackdropFilter = originalWebkitBackdrops[i];
                });

                const link = document.createElement('a');
                link.download = `Portafolio_${new Date().toISOString().slice(0,10)}.png`;
                link.href = canvas.toDataURL('image/png', 1.0);
                link.click();
            }).catch(err => {
                console.error("Error al exportar:", err);
                body.style.backgroundAttachment = originalBgAttachment;
                panels.forEach((p, i) => {
                    p.style.backdropFilter = originalBackdrops[i];
                    p.style.webkitBackdropFilter = originalWebkitBackdrops[i];
                });
                alert("Hubo un error al generar la imagen. Revisa la consola.");
            });
        }

            if (campo === 'capital' || campo === 'risk') {
                const tr = document.querySelectorAll('#tabla-datos tbody tr')[index];

        }

            if(isChecked) {
                if(!visibleCols.includes(key)) visibleCols.push(key);

            localStorage.setItem('visibleCols', JSON.stringify(visibleCols));

        // Navegación con TAB
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                const inputs = Array.from(document.querySelectorAll('#tabla-datos input, #tabla-datos select')).filter(el => !el.disabled && !el.readOnly);
                const current = document.activeElement;
                if (inputs.includes(current)) {
                    e.preventDefault();
                    const index = inputs.indexOf(current);
                    const isShift = e.shiftKey;
                    let nextIndex = isShift ? index - 1 : index + 1;
                    if (nextIndex >= inputs.length) {
                        document.querySelector('.btn-add').focus();
                    } else if (nextIndex < 0) {
                        inputs[inputs.length - 1].focus();
                    } else {
                        inputs[nextIndex].focus();
                        inputs[nextIndex].select();
                    }
                } else if (current.classList.contains('btn-add') && !e.shiftKey) {
                    e.preventDefault();
                    inputs[0].focus();
                    inputs[0].select();
                }
            }
        });

        guardarYRenderizar();
    </script>
</body>
</html>
