<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💼 Portafolio</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        :root {
            --bg-color: #e0e5ec;
            --pattern-color: rgba(255, 255, 255, 0.4);
            --pattern-display: block;
            
            --card-bg: rgba(255, 255, 255, 0.75);
            --text-main: #2d3748;
            --text-muted: #718096;
            --border-color: #e2e8f0;
            --input-bg: rgba(255, 255, 255, 0.9);
            --input-border: #cbd5e0;
            --bar-bg: #edf2f7;
            --zero-line: #a0aec0;
            --axis-line: #cbd5e0;
            --shadow: 0 8px 32px rgba(31, 38, 135, 0.1);
            --glass-border: 1px solid rgba(255, 255, 255, 0.5);
            --bar-gap: 25px;
            --chart-label-size: 11px; /* Variable para el tamaño de letra del gráfico */
        }

        body.dark-mode {
            --bg-color: #1a202c;
            --pattern-color: rgba(255, 255, 255, 0.03);
            --card-bg: rgba(45, 55, 72, 0.75);
            --text-main: #f7fafc;
            --text-muted: #a0aec0;
            --border-color: #4a5568;
            --input-bg: rgba(26, 32, 44, 0.9);
            --input-border: #4a5568;
            --bar-bg: #4a5568;
            --zero-line: #718096;
            --axis-line: #4a5568;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --glass-border: 1px solid rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            transition: background 0.3s ease, color 0.3s ease;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: 
                linear-gradient(45deg, var(--pattern-color) 25%, transparent 25%, transparent 75%, var(--pattern-color) 75%, var(--pattern-color)), 
                linear-gradient(-45deg, var(--pattern-color) 25%, transparent 25%, transparent 75%, var(--pattern-color) 75%, var(--pattern-color));
            background-size: 60px 60px;
            z-index: -1;
            pointer-events: none;
            display: var(--pattern-display);
        }

        .container {
            max-width: 1800px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            align-items: start; 
            z-index: 1;
            transition: grid-template-columns 0.3s ease;
        }

        .container.collapsed {
            grid-template-columns: 0fr 1fr;
            gap: 0;
        }
        .container.collapsed .panel-tabla {
            opacity: 0;
            pointer-events: none;
            padding: 0;
            margin: 0;
            overflow: hidden;
        }

        @media (max-width: 1200px) {
            .container { grid-template-columns: 1fr; }
            .container.collapsed { grid-template-columns: 0fr 1fr; }
        }

        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: var(--glass-border);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 15px;
            transition: background 0.3s ease, opacity 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .panel-header {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 15px;
        }
        /* Títulos en mayúsculas */
        h2 { margin: 0; font-size: 18px; text-align: center; text-transform: uppercase; letter-spacing: 1px; }
        
        .panel-btn {
            position: absolute;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 16px;
            cursor: pointer;
            padding: 5px;
            transition: color 0.2s;
        }
        .panel-btn:hover { color: var(--text-main); }
        .btn-toggle-left { right: 0; }
        .btn-toggle-chart { right: 0; }

        /* Reloj */
        .datetime-display {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: capitalize;
            z-index: 10;
        }

        .btn-float-open {
            position: fixed;
            left: 10px;
            top: 20px;
            background: var(--card-bg);
            border: var(--glass-border);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow);
            z-index: 200;
            color: var(--text-main);
            backdrop-filter: blur(10px);
        }
        .container.collapsed ~ .btn-float-open { display: flex; }

        .chart-settings-menu {
            position: absolute;
            top: 35px;
            right: 0;
            background: var(--card-bg);
            border: var(--glass-border);
            border-radius: 8px;
            padding: 15px;
            box-shadow: var(--shadow);
            z-index: 50;
            display: none;
            flex-direction: column;
            gap: 8px;
            font-size: 12px;
            backdrop-filter: blur(10px);
            width: 220px;
        }
        .chart-settings-menu.active { display: flex; }
        .chart-settings-menu label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .chart-settings-menu hr { width: 100%; border: 0; border-top: 1px solid var(--border-color); margin: 5px 0; }

        .table-container { width: 100%; overflow-x: auto; flex-grow: 1; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 5px 3px; text-align: left; border-bottom: 1px solid var(--border-color); vertical-align: middle; white-space: nowrap; }
        
        th { font-size: 10px; color: var(--text-muted); text-transform: uppercase; cursor: grab; user-select: none; }
        th:active { cursor: grabbing; }
        
        input, select {
            padding: 5px; border: 1px solid var(--input-border); border-radius: 4px;
            font-family: inherit; font-size: 11px; box-sizing: border-box; background: var(--input-bg); color: var(--text-main);
            transition: border-color 0.2s;
        }
        input:focus, select:focus { border-color: #4299e1; outline: none; }
        
        .in-name { width: 75px; }
        .in-cap { width: 65px; text-align: right; }
        .in-cost { width: 55px; text-align: right; }
        .in-date { width: 75px; text-align: center; }
        .in-mod { width: 85px; }
        .in-status { width: 95px; }
        .in-num { width: 45px; text-align: center; }
        .in-url { width: 60px; font-size: 10px; }
        .in-notes { width: 80px; }
        .in-check { width: 16px; height: 16px; cursor: pointer; accent-color: #4299e1; }
        
        .btn-delete {
            background: transparent; border: none; cursor: pointer; font-size: 14px; color: #e53e3e; 
            transition: transform 0.2s;
        }
        .btn-delete:hover { transform: scale(1.2); }

        .btn-add {
            background: #4299e1; color: white; border: none; padding: 10px 15px;
            border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 15px;
            width: 100%; font-size: 13px; transition: background 0.2s;
        }
        .btn-add:hover { background: #3182ce; }

        /* --- GRÁFICO --- */
        .chart-layout { 
            display: flex; 
            position: relative; 
            margin-top: 30px; /* Más margen para el reloj */
            padding-bottom: 10px;
        }

        .y-axis {
            position: relative; 
            width: 35px; 
            height: 300px; 
            border-right: 1px solid var(--axis-line); 
            margin-right: 15px;
            flex-shrink: 0;
        }
        .y-tick {
            position: absolute; right: 5px; transform: translateY(-50%);
            font-size: 10px; color: var(--text-muted); font-weight: 600;
        }
        .y-tick::after { content: ''; position: absolute; right: -16px; top: 50%; width: 10px; height: 1px; background: var(--axis-line); }

        .charts-wrapper { 
            display: flex; 
            gap: var(--bar-gap); 
            flex-grow: 1; 
            position: relative; 
            align-items: flex-start; 
            overflow-x: auto;
            overflow-y: hidden;
        }

        .global-zero-line {
            position: absolute; width: 100%; height: 1px;
            background-color: var(--zero-line); z-index: 0; border-bottom: 1px dashed var(--axis-line);
            transform: translateY(-50%);
        }

        .chart-column { 
            position: relative; 
            width: 45px; 
            flex-shrink: 0; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
        }

        .bar-container {
            position: relative;
            width: 100%;
            height: 300px; 
        }

        .bar-range-bg {
            position: absolute; width: 100%; background-color: var(--bar-bg);
            border-radius: 4px; z-index: 1; display: flex; justify-content: center;
        }

        .target-text {
            position: absolute; top: -18px; font-size: 10px; font-weight: 700; color: var(--text-muted);
        }

        .bar-fill {
            position: absolute; width: 100%; border-radius: 4px; z-index: 2; 
            transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center;
        }

        .val-text { font-size: 10px; font-weight: bold; }

        .labels-area {
            width: 110px; 
            text-align: center; 
            padding-top: 10px;
            z-index: 10;
        }

        /* Aplicando la variable de tamaño de letra a los textos */
        .name-text { font-size: var(--chart-label-size); font-weight: 600; margin-bottom: 2px; word-wrap: break-word; white-space: normal; }
        .cap-text { font-size: calc(var(--chart-label-size) - 1px); color: #3182ce; font-weight: bold; margin-bottom: 2px; }
        .status-text { font-size: calc(var(--chart-label-size) - 1px); margin-bottom: 2px; white-space: normal;}
        .date-text { font-size: calc(var(--chart-label-size) - 2px); color: var(--text-muted); margin-bottom: 2px; }
        .audit-link { font-size: calc(var(--chart-label-size) - 1px); color: #4299e1; text-decoration: none; display: block; margin-bottom: 4px; font-weight: 600;}
        .audit-link:hover { text-decoration: underline; }
        .notes-text { font-size: calc(var(--chart-label-size) - 2px); color: var(--text-muted); font-style: italic; word-wrap: break-word; white-space: normal; line-height: 1.1;}

        /* --- CONFIGURACIÓN FLOTANTE GLOBAL --- */
        .settings-btn {
            position: fixed; bottom: 20px; left: 20px;
            background: var(--card-bg); color: var(--text-main);
            border: var(--glass-border); border-radius: 50%;
            width: 45px; height: 45px; font-size: 20px; cursor: pointer;
            box-shadow: var(--shadow); z-index: 100;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s; backdrop-filter: blur(10px);
        }
        .settings-btn:hover { transform: rotate(90deg); }

        .settings-panel {
            position: fixed; bottom: 75px; left: 20px;
            background: var(--card-bg); border: var(--glass-border);
            border-radius: 10px; padding: 15px; width: 280px;
            box-shadow: var(--shadow); z-index: 100;
            display: none; flex-direction: column; gap: 10px; backdrop-filter: blur(10px);
            max-height: 80vh; overflow-y: auto;
        }
        .settings-panel.active { display: flex; }
        
        .settings-panel label { font-size: 12px; font-weight: 600; display: flex; justify-content: space-between; align-items: center;}
        .settings-panel input[type="color"] { width: 30px; height: 25px; padding: 0; border: none; cursor: pointer; }
        .settings-input { width: 100%; padding: 6px; font-size: 11px; margin-top: 5px; }
        
        .toggle-btn {
            background: #4299e1; color: white; border: none; padding: 8px;
            border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px;
        }
        .toggle-btn.secondary { background: #718096; }
        .toggle-btn:hover { opacity: 0.9; }
        .checkbox-label { font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer; }
        input[type="range"] { width: 100%; cursor: pointer; }

        /* Marca de agua */
        .watermark {
            position: fixed;
            bottom: 25px;
            right: 25px;
            font-size: 13px;
            color: var(--text-muted);
            opacity: 0.7;
            z-index: 100;
            font-weight: 500;
            pointer-events: auto;
        }
        .watermark a {
            color: inherit;
            text-decoration: none;
            font-weight: bold;
        }
        .watermark a:hover {
            text-decoration: underline;
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <!-- Panel Tabla -->
        <div class="panel-tabla glass-panel" id="panel-tabla">
            <div class="panel-header">
                <h2>Cuentas</h2>
                <button class="panel-btn btn-toggle-left" onclick="toggleLeftPanel()" title="Ocultar Panel">⬅️</button>
            </div>
            <div class="table-container">
                <table id="tabla-datos">
                    <thead>
                        <tr id="table-headers"></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <button class="btn-add" onclick="agregarFila()">+ Añadir Cuenta</button>
        </div>

        <!-- Panel Gráfico -->
        <div class="panel-grafico glass-panel">
            <!-- Reloj en vivo -->
            <div class="datetime-display" id="datetime-display"></div>

            <div class="panel-header">
                <h2>Gráfico</h2>
                <button class="panel-btn btn-toggle-chart" onclick="toggleChartSettings()" title="Configurar">⚙️</button>
                
                <!-- Menú de opciones del gráfico -->
                <div class="chart-settings-menu" id="chart-settings-menu">
                    <span style="font-weight:bold; font-size:11px; color:var(--text-muted);">Mostrar textos:</span>
                    <label><input type="checkbox" id="chk-name" checked onchange="toggleChartLabel('name', this.checked)"> Cuenta</label>
                    <label><input type="checkbox" id="chk-capital" checked onchange="toggleChartLabel('capital', this.checked)"> Capital</label>
                    <label><input type="checkbox" id="chk-status" checked onchange="toggleChartLabel('status', this.checked)"> Estado</label>
                    <label><input type="checkbox" id="chk-date" checked onchange="toggleChartLabel('date', this.checked)"> Fecha</label>
                    <label><input type="checkbox" id="chk-url" checked onchange="toggleChartLabel('url', this.checked)"> URL</label>
                    <label><input type="checkbox" id="chk-notes" checked onchange="toggleChartLabel('notes', this.checked)"> Notas</label>
                    
                    <hr>
                    <label style="flex-direction: column; align-items: flex-start; gap: 5px;">
                        <span>Tamaño de letra: <span id="font-size-val">11</span>px</span>
                        <input type="range" id="font-size-slider" min="8" max="20" value="11" oninput="cambiarFontSize(this.value)">
                    </label>
                    <label style="flex-direction: column; align-items: flex-start; gap: 5px;">
                        <span>Separación de barras:</span>
                        <input type="range" id="gap-slider" min="5" max="80" value="25" oninput="cambiarGapBarras(this.value)">
                    </label>
                </div>
            </div>
            <div class="chart-layout">
                <div class="y-axis" id="y-axis"></div>
                <div class="charts-wrapper" id="chart-area">
                    <div class="global-zero-line" id="global-zero-line"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Botón flotante para recuperar panel izquierdo -->
    <button class="btn-float-open" onclick="toggleLeftPanel()" title="Mostrar Panel">➡️</button>

    <!-- Configuración Flotante Global -->
    <button class="settings-btn" onclick="toggleGlobalSettings()">⚙️</button>
    <div class="settings-panel" id="global-settings-panel">
        <label>Positivo (Examen): <input type="color" id="color-pos" onchange="guardarColores()"></label>
        <label>Negativo (Examen): <input type="color" id="color-neg" onchange="guardarColores()"></label>
        <label>Aprobado: <input type="color" id="color-passed" onchange="guardarColores()"></label>
        <label>Desaprobado: <input type="color" id="color-failed" onchange="guardarColores()"></label>
        <label>Propio (+): <input type="color" id="color-own-pos" onchange="guardarColores()"></label>
        <label>Propio (-): <input type="color" id="color-own-neg" onchange="guardarColores()"></label>
        
        <hr style="width:100%; border:0; border-top:1px solid var(--border-color); margin: 5px 0;">
        
        <div>
            <label style="font-size:11px; color:var(--text-muted);">URL de imagen de fondo:</label>
            <input type="text" id="bg-url-input" class="settings-input" placeholder="https://ejemplo.com/foto.jpg" onchange="cambiarFondo(this.value)">
            <label style="font-size:11px; color:var(--text-muted); margin-top:5px; display:block;">O sube un archivo:</label>
            <input type="file" id="bg-file-input" class="settings-input" accept="image/*" onchange="cargarImagenLocal(event)">
        </div>

        <div>
            <label style="font-size:11px; color:var(--text-muted);">Opacidad de la capa: <span id="opacity-val">50</span>%</label>
            <input type="range" id="bg-opacity" min="0" max="100" value="50" oninput="cambiarOpacidad(this.value)">
        </div>
        
        <label class="checkbox-label">
            <input type="checkbox" id="toggle-pattern" checked onchange="togglePattern(this.checked)"> 
            Mostrar textura geométrica
        </label>

        <button class="toggle-btn" onclick="toggleDarkMode()">Modo Oscuro 🌙 / ☀️</button>
        <button class="toggle-btn secondary" onclick="quitarFondo()">Quitar Imagen de Fondo</button>
    </div>

    <!-- Marca de agua -->
    <div class="watermark">
        creado por <a href="https://www.instagram.com/aandresfx/" target="_blank">aandres.fx</a>
    </div>

    <script>
        // --- COLUMNAS ---
        const columnasDef = [
            { key: 'visible', label: '👁' },
            { key: 'name', label: 'Cuenta' },
            { key: 'capital', label: 'Capital' },
            { key: 'cost', label: 'Costo' },
            { key: 'startDate', label: 'Inicio' },
            { key: 'modality', label: 'Modalidad' },
            { key: 'status', label: 'Estado' },
            { key: 'actual', label: 'Actual' },
            { key: 'min', label: 'Mín' },
            { key: 'max', label: 'Obj' },
            { key: 'url', label: 'URL' },
            { key: 'notes', label: 'Notas' },
            { key: 'actions', label: '' }
        ];

        let columnOrder = JSON.parse(localStorage.getItem('columnOrder')) || ['visible', 'name', 'capital', 'cost', 'startDate', 'modality', 'status', 'actual', 'min', 'max', 'url', 'notes', 'actions'];
        columnOrder = columnOrder.filter(k => columnasDef.find(c => c.key === k));
        columnasDef.forEach(c => { if(!columnOrder.includes(c.key)) columnOrder.push(c.key); });

        // --- DATOS ---
        let cuentas = JSON.parse(localStorage.getItem('misCuentasPro')) || [
            { visible: true, name: "FTMO 100k", capital: 100000, cost: 510, startDate: "01/09/2024", modality: "Examen", status: "En curso ⏳", actual: -9.4, min: -10, max: 10, notes: "Fase 1/2", url: "" },
            { visible: true, name: "FTMO 25k", capital: 25000, cost: 250, startDate: "02/10/2024", modality: "Examen", status: "Aprobado ✅", actual: 10.0, min: -10, max: 10, notes: "Fase 1/2", url: "https://www.myfxbook.com" },
            { visible: true, name: "Bullfy", capital: 5000, cost: 100, startDate: "10/10/2026", modality: "Mixto", status: "Desaprobado ❌", actual: -3.0, min: -4, max: 8, notes: "Fase Única", url: "" },
            { visible: true, name: "Personal", capital: 10000, cost: 0, startDate: "15/11/2026", modality: "Capital propio", status: "En curso ⏳", actual: 2.5, min: null, max: null, notes: "Ahorros", url: "" }
        ];

        let colores = JSON.parse(localStorage.getItem('misColores')) || { 
            pos: "#38a169", neg: "#e53e3e", 
            passed: "#a3e635", failed: "#7f1d1d",
            ownPos: "#3b82f6", ownNeg: "#ec4899"
        };

        let chartLabels = JSON.parse(localStorage.getItem('chartLabels')) || {
            name: true, capital: true, status: true, date: true, url: true, notes: true
        };

        let isDarkMode = localStorage.getItem('darkMode') === 'true';
        let savedBgImage = localStorage.getItem('bgImage') || 'none';
        let showPattern = localStorage.getItem('showPattern') !== 'false';
        let overlayOpacity = parseInt(localStorage.getItem('overlayOpacity') || 50);
        let barGap = parseInt(localStorage.getItem('barGap') || 25);
        let chartFontSize = parseInt(localStorage.getItem('chartFontSize') || 11); // Nueva variable para tamaño de letra
        
        let currentSort = { key: null, dir: 'asc' };
        let isDraggingColumn = false;

        // Inicializar UI
        document.getElementById('color-pos').value = colores.pos;
        document.getElementById('color-neg').value = colores.neg;
        document.getElementById('color-passed').value = colores.passed;
        document.getElementById('color-failed').value = colores.failed;
        document.getElementById('color-own-pos').value = colores.ownPos;
        document.getElementById('color-own-neg').value = colores.ownNeg;

        document.getElementById('chk-name').checked = chartLabels.name;
        document.getElementById('chk-capital').checked = chartLabels.capital;
        document.getElementById('chk-status').checked = chartLabels.status;
        document.getElementById('chk-date').checked = chartLabels.date;
        document.getElementById('chk-url').checked = chartLabels.url;
        document.getElementById('chk-notes').checked = chartLabels.notes;

        document.getElementById('gap-slider').value = barGap;
        document.documentElement.style.setProperty('--bar-gap', barGap + 'px');
        
        document.getElementById('font-size-slider').value = chartFontSize;
        document.getElementById('font-size-val').innerText = chartFontSize;
        document.documentElement.style.setProperty('--chart-label-size', chartFontSize + 'px');

        document.getElementById('toggle-pattern').checked = showPattern;
        document.getElementById('bg-opacity').value = overlayOpacity;
        document.getElementById('opacity-val').innerText = overlayOpacity;
        
        if(isDarkMode) document.body.classList.add('dark-mode');
        if(!showPattern) document.documentElement.style.setProperty('--pattern-display', 'none');
        if(savedBgImage !== 'none') document.getElementById('bg-url-input').value = savedBgImage.startsWith('data:') ? '(Imagen local cargada)' : savedBgImage;

        // --- RELOJ EN VIVO ---
        function updateClock() {
            const now = new Date();
            const optionsDate = { weekday: 'long', day: 'numeric', month: 'long' };
            const dateStr = now.toLocaleDateString('es-ES', optionsDate);
            const timeStr = now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('datetime-display').innerText = `${dateStr} ${timeStr} hs`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function updateBackground() {
            let rgb = isDarkMode ? '26, 32, 44' : '255, 255, 255';
            let op = overlayOpacity / 100;
            let url = savedBgImage === 'none' ? 'none' : `url('${savedBgImage}')`;
            if (savedBgImage === 'none') document.body.style.backgroundImage = 'none';
            else document.body.style.backgroundImage = `linear-gradient(rgba(${rgb}, ${op}), rgba(${rgb}, ${op})), ${url}`;
            document.body.style.backgroundColor = isDarkMode ? '#1a202c' : '#e0e5ec';
        }
        updateBackground();

        // --- UTILIDADES ---
        function getCurrencyStr(num) {
            if(num === null || num === undefined || num === '') return '';
            return '$' + Number(num).toLocaleString('es-AR');
        }
        function parseCurrency(str) {
            if(!str) return '';
            let num = str.toString().replace(/\D/g, '');
            return num ? parseInt(num, 10) : '';
        }
        function getPercentStr(num, decimals) {
            if(num === null || num === undefined || num === '') return '';
            return Number(num).toFixed(decimals) + '%';
        }
        function parsePercent(str) {
            if(!str) return '';
            let num = str.toString().replace(',', '.').replace(/[^\d.-]/g, '');
            return num ? parseFloat(num) : '';
        }
        function formatDate(input) {
            let val = input.value.replace(/\D/g, '');
            if (val.length > 2 && val.length <= 4) val = val.substring(0, 2) + '/' + val.substring(2);
            else if (val.length > 4) val = val.substring(0, 2) + '/' + val.substring(2, 4) + '/' + val.substring(4, 8);
            input.value = val;
        }
        function parseDate(dateStr) {
            if(!dateStr) return new Date(0);
            const parts = dateStr.split('/');
            if(parts.length === 3) return new Date(parts[2], parts[1]-1, parts[0]);
            return new Date(dateStr);
        }
        function getContrastColor(hexcolor) {
            if(!hexcolor) return '#ffffff';
            let r = parseInt(hexcolor.substr(1, 2), 16);
            let g = parseInt(hexcolor.substr(3, 2), 16);
            let b = parseInt(hexcolor.substr(5, 2), 16);
            let yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
            return (yiq >= 128) ? '#000000' : '#ffffff';
        }

        // --- RENDERIZADO ---
        function renderTabla() {
            const theadTr = document.getElementById('table-headers');
            const tbody = document.querySelector('#tabla-datos tbody');
            theadTr.innerHTML = '';
            
            columnOrder.forEach(key => {
                const colDef = columnasDef.find(c => c.key === key);
                const th = document.createElement('th');
                th.dataset.key = key;

                let sortIcon = '';
                if (currentSort.key === key) {
                    sortIcon = currentSort.dir === 'asc' ? ' ⬆' : ' ⬇';
                } else {
                    sortIcon = ' ⇅';
                }

                if (key === 'visible') {
                    const isAllVisible = cuentas.every(c => c.visible !== false);
                    th.innerHTML = `<input type="checkbox" class="in-check" ${isAllVisible ? 'checked' : ''} onchange="toggleAllVisibility(this.checked)" title="Mostrar/Ocultar todas">`;
                } else if (key === 'actions') {
                    th.innerText = '';
                } else {
                    th.innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center; width:100%; pointer-events:none;">
                        ${colDef.label} <span style="font-size: 8px; opacity: 0.5;">${sortIcon}</span>
                    </div>`;
                    th.onclick = (e) => {
                        if (!isDraggingColumn && e.target.tagName !== 'INPUT') {
                            sortTable(key);
                        }
                    };
                }
                theadTr.appendChild(th);
            });

            tbody.innerHTML = '';
            cuentas.forEach((cuenta, index) => {
                const tr = document.createElement('tr');
                columnOrder.forEach(key => {
                    const td = document.createElement('td');
                    const isPropio = cuenta.modality === 'Capital propio';

                    switch(key) {
                        case 'visible':
                            td.innerHTML = `<input type="checkbox" class="in-check" ${cuenta.visible !== false ? 'checked' : ''} onchange="actualizarDato(${index}, 'visible', this.checked)">`;
                            break;
                        case 'name':
                            td.innerHTML = `<input type="text" class="in-name" value="${cuenta.name}" onchange="actualizarDato(${index}, 'name', this.value)">`;
                            break;
                        case 'capital':
                            td.innerHTML = `<input type="text" class="in-cap" value="${getCurrencyStr(cuenta.capital)}" onfocus="this.value = parseCurrency(this.value) || ''" onblur="this.value = getCurrencyStr(parseCurrency(this.value)); actualizarDato(${index}, 'capital', parseCurrency(this.value))" onkeydown="if(event.key==='Enter') this.blur()">`;
                            break;
                        case 'cost':
                            td.innerHTML = `<input type="text" class="in-cost" value="${getCurrencyStr(cuenta.cost)}" onfocus="this.value = parseCurrency(this.value) || ''" onblur="this.value = getCurrencyStr(parseCurrency(this.value)); actualizarDato(${index}, 'cost', parseCurrency(this.value))" onkeydown="if(event.key==='Enter') this.blur()" placeholder="-$">`;
                            break;
                        case 'startDate':
                            td.innerHTML = `<input type="text" class="in-date" value="${cuenta.startDate}" oninput="formatDate(this)" onchange="actualizarDato(${index}, 'startDate', this.value)" placeholder="DD/MM/AAAA">`;
                            break;
                        case 'modality':
                            td.innerHTML = `<select class="in-mod" onchange="cambiarModalidad(${index}, this.value)">
                                <option value="Examen" ${cuenta.modality === 'Examen' ? 'selected' : ''}>Examen</option>
                                <option value="Capital propio" ${cuenta.modality === 'Capital propio' ? 'selected' : ''}>Capital propio</option>
                                <option value="Mixto" ${cuenta.modality === 'Mixto' ? 'selected' : ''}>Mixto</option>
                            </select>`;
                            break;
                        case 'status':
                            td.innerHTML = `<select class="in-status" onchange="actualizarDato(${index}, 'status', this.value)">
                                <option value="En curso ⏳" ${cuenta.status === 'En curso ⏳' ? 'selected' : ''}>En curso ⏳</option>
                                <option value="Aprobado ✅" ${cuenta.status === 'Aprobado ✅' ? 'selected' : ''}>Aprobado ✅</option>
                                <option value="Desaprobado ❌" ${cuenta.status === 'Desaprobado ❌' ? 'selected' : ''}>Desaprobado ❌</option>
                            </select>`;
                            break;
                        case 'actual':
                            td.innerHTML = `<input type="text" class="in-num" value="${getPercentStr(cuenta.actual, 1)}" onfocus="this.value = parsePercent(this.value) || ''" onblur="this.value = getPercentStr(parsePercent(this.value), 1); actualizarDato(${index}, 'actual', parsePercent(this.value))" onkeydown="if(event.key==='Enter') this.blur()">`;
                            break;
                        case 'min':
                            td.innerHTML = `<input type="text" class="in-num" value="${isPropio ? '' : getPercentStr(cuenta.min, 0)}" ${isPropio ? 'disabled placeholder="N/A"' : ''} onfocus="this.value = parsePercent(this.value) || ''" onblur="this.value = getPercentStr(parsePercent(this.value), 0); actualizarDato(${index}, 'min', parsePercent(this.value))" onkeydown="if(event.key==='Enter') this.blur()">`;
                            break;
                        case 'max':
                            td.innerHTML = `<input type="text" class="in-num" value="${isPropio ? '' : getPercentStr(cuenta.max, 0)}" ${isPropio ? 'disabled placeholder="N/A"' : ''} onfocus="this.value = parsePercent(this.value) || ''" onblur="this.value = getPercentStr(parsePercent(this.value), 0); actualizarDato(${index}, 'max', parsePercent(this.value))" onkeydown="if(event.key==='Enter') this.blur()">`;
                            break;
                        case 'url':
                            td.innerHTML = `<input type="url" class="in-url" value="${cuenta.url || ''}" onchange="actualizarDato(${index}, 'url', this.value)" placeholder="https://...">`;
                            break;
                        case 'notes':
                            td.innerHTML = `<input type="text" class="in-notes" value="${cuenta.notes || ''}" onchange="actualizarDato(${index}, 'notes', this.value)" placeholder="...">`;
                            break;
                        case 'actions':
                            td.innerHTML = `<button class="btn-delete" onclick="eliminarCuenta(${index})" title="Eliminar cuenta">🗑️</button>`;
                            break;
                    }
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });

            if(!window.sortableInitialized) {
                new Sortable(theadTr, {
                    animation: 150,
                    onStart: function() { isDraggingColumn = true; },
                    onEnd: function (evt) {
                        const newOrder = Array.from(theadTr.children).map(th => th.dataset.key);
                        columnOrder = newOrder;
                        localStorage.setItem('columnOrder', JSON.stringify(columnOrder));
                        renderTabla(); 
                        setTimeout(() => { isDraggingColumn = false; }, 100);
                    }
                });
                window.sortableInitialized = true;
            }
        }

        function sortTable(key) {
            if (currentSort.key === key) {
                currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort.key = key;
                currentSort.dir = 'asc';
            }

            cuentas.sort((a, b) => {
                let valA = a[key];
                let valB = b[key];

                if (valA === null || valA === undefined) valA = '';
                if (valB === null || valB === undefined) valB = '';

                if (['capital', 'cost', 'actual', 'min', 'max'].includes(key)) {
                    valA = Number(valA) || 0;
                    valB = Number(valB) || 0;
                } else if (key === 'startDate') {
                    valA = parseDate(valA);
                    valB = parseDate(valB);
                } else {
                    valA = valA.toString().toLowerCase();
                    valB = valB.toString().toLowerCase();
                }

                if (valA < valB) return currentSort.dir === 'asc' ? -1 : 1;
                if (valA > valB) return currentSort.dir === 'asc' ? 1 : -1;
                return 0;
            });

            renderTabla();
        }

        function eliminarCuenta(index) {
            if(confirm("¿Seguro que deseas eliminar esta cuenta?")) {
                cuentas.splice(index, 1);
                guardarYRenderizar();
            }
        }

        function toggleAllVisibility(isChecked) {
            cuentas.forEach(c => c.visible = isChecked);
            guardarYRenderizar();
        }

        function cambiarModalidad(index, valor) {
            cuentas[index].modality = valor;
            if (valor === 'Capital propio') {
                cuentas[index].min = null;
                cuentas[index].max = null;
            } else if (cuentas[index].min === null || cuentas[index].min === '') {
                cuentas[index].min = -10;
                cuentas[index].max = 10;
            }
            guardarYRenderizar();
        }

        function renderGrafico() {
            const chartArea = document.getElementById('chart-area');
            const yAxis = document.getElementById('y-axis');
            
            chartArea.innerHTML = '<div class="global-zero-line" id="global-zero-line"></div>';
            yAxis.innerHTML = '';

            const cuentasVisibles = cuentas.filter(c => c.visible !== false);
            cuentasVisibles.sort((a, b) => parseDate(a.startDate) - parseDate(b.startDate));

            let maxAbs = 10; 
            cuentasVisibles.forEach(c => {
                if(c.modality !== 'Capital propio') {
                    const valMin = Math.abs(Number(c.min) || 0);
                    const valMax = Math.abs(Number(c.max) || 0);
                    if (valMin > maxAbs) maxAbs = valMin;
                    if (valMax > maxAbs) maxAbs = valMax;
                }
            });

            const globalMax = Math.ceil(maxAbs / 5) * 5;
            const globalMin = -globalMax;
            const rangeGlobal = globalMax - globalMin;
            const zeroBottomPercent = 50; 

            const step = rangeGlobal > 30 ? 10 : 5;
            for (let i = globalMin; i <= globalMax; i += step) {
                const topPercent = 100 - (((i - globalMin) / rangeGlobal) * 100);
                const tick = document.createElement('div');
                tick.className = 'y-tick';
                tick.style.top = `${topPercent}%`;
                tick.innerText = `${i}%`;
                yAxis.appendChild(tick);
            }

            const zeroLineTop = 300 - (300 * (zeroBottomPercent / 100));
            document.getElementById('global-zero-line').style.top = `${zeroLineTop}px`;

            cuentasVisibles.forEach(cuenta => {
                const column = document.createElement('div');
                column.className = 'chart-column';
                const isPropio = cuenta.modality === 'Capital propio';
                
                let displayValue = Number(cuenta.actual) || 0;
                let color = colores.pos;
                
                if (cuenta.status.includes('Desaprobado') && !isPropio) {
                    displayValue = Number(cuenta.min);
                    color = colores.failed;
                } else if (cuenta.status.includes('Aprobado') && !isPropio) {
                    displayValue = Number(cuenta.max);
                    color = colores.passed;
                } else if (isPropio) {
                    color = displayValue >= 0 ? colores.ownPos : colores.ownNeg;
                } else {
                    color = displayValue >= 0 ? colores.pos : colores.neg;
                }
                
                const textColor = getContrastColor(color);
                let textoValor = displayValue > 0 ? `+${displayValue.toFixed(1)}%` : `${displayValue.toFixed(1)}%`;

                let rangeHeightPercent = 0;
                let rangeBottomPercent = 0;
                if(!isPropio && cuenta.min !== '' && cuenta.max !== '') {
                    rangeHeightPercent = ((Number(cuenta.max) - Number(cuenta.min)) / rangeGlobal) * 100;
                    rangeBottomPercent = ((Number(cuenta.min) - globalMin) / rangeGlobal) * 100;
                }

                let fillHeightPercent = (Math.abs(displayValue) / rangeGlobal) * 100;
                let fillBottomPercent = zeroBottomPercent;
                if (displayValue < 0) fillBottomPercent = zeroBottomPercent - fillHeightPercent;
                if (displayValue === 0) fillHeightPercent = 0;

                let targetHTML = (!isPropio && cuenta.max !== '' && cuenta.max !== null) ? `<div class="target-text">${Number(cuenta.max).toFixed(0)}%</div>` : '';
                
                // Textos sin el emoji en el enlace de auditoría
                let labelsHTML = '';
                if (chartLabels.name) labelsHTML += `<div class="name-text">${cuenta.name}</div>`;
                if (chartLabels.capital) labelsHTML += `<div class="cap-text">${getCurrencyStr(cuenta.capital)}</div>`;
                if (chartLabels.status) labelsHTML += `<div class="status-text">${cuenta.status || ''}</div>`;
                if (chartLabels.date) labelsHTML += `<div class="date-text">${cuenta.startDate || ''}</div>`;
                if (chartLabels.url && cuenta.url && cuenta.url.trim() !== '') labelsHTML += `<a href="${cuenta.url}" target="_blank" class="audit-link">Auditoría</a>`;
                if (chartLabels.notes) labelsHTML += `<div class="notes-text">${cuenta.notes || ''}</div>`;

                column.innerHTML = `
                    <div class="bar-container">
                        ${!isPropio ? `<div class="bar-range-bg" style="bottom: ${rangeBottomPercent}%; height: ${rangeHeightPercent}%;">${targetHTML}</div>` : ''}
                        <div class="bar-fill" style="bottom: ${fillBottomPercent}%; height: ${fillHeightPercent}%; background-color: ${color};">
                            <span class="val-text" style="color: ${textColor};">${textoValor}</span>
                        </div>
                    </div>
                    <div class="labels-area">${labelsHTML}</div>
                `;
                chartArea.appendChild(column);
            });
        }

        // --- ACCIONES ---
        function actualizarDato(index, campo, valor) {
            cuentas[index][campo] = valor;
            guardarYRenderizar();
        }

        function guardarColores() {
            colores.pos = document.getElementById('color-pos').value;
            colores.neg = document.getElementById('color-neg').value;
            colores.passed = document.getElementById('color-passed').value;
            colores.failed = document.getElementById('color-failed').value;
            colores.ownPos = document.getElementById('color-own-pos').value;
            colores.ownNeg = document.getElementById('color-own-neg').value;
            localStorage.setItem('misColores', JSON.stringify(colores));
            renderGrafico();
        }

        function toggleChartLabel(key, isChecked) {
            chartLabels[key] = isChecked;
            localStorage.setItem('chartLabels', JSON.stringify(chartLabels));
            renderGrafico();
        }

        function cambiarGapBarras(val) {
            barGap = parseInt(val);
            document.documentElement.style.setProperty('--bar-gap', barGap + 'px');
            localStorage.setItem('barGap', barGap);
        }

        function cambiarFontSize(val) {
            chartFontSize = parseInt(val);
            document.getElementById('font-size-val').innerText = chartFontSize;
            document.documentElement.style.setProperty('--chart-label-size', chartFontSize + 'px');
            localStorage.setItem('chartFontSize', chartFontSize);
        }

        function toggleGlobalSettings() { document.getElementById('global-settings-panel').classList.toggle('active'); }
        function toggleChartSettings() { document.getElementById('chart-settings-menu').classList.toggle('active'); }

        document.addEventListener('click', function(event) {
            const menu = document.getElementById('chart-settings-menu');
            const btn = document.querySelector('.btn-toggle-chart');
            if (menu.classList.contains('active') && !menu.contains(event.target) && !btn.contains(event.target)) {
                menu.classList.remove('active');
            }
        });

        function toggleLeftPanel() {
            const container = document.getElementById('main-container');
            container.classList.toggle('collapsed');
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            isDarkMode = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDarkMode);
            updateBackground();
        }

        function togglePattern(isChecked) {
            showPattern = isChecked;
            document.documentElement.style.setProperty('--pattern-display', isChecked ? 'block' : 'none');
            localStorage.setItem('showPattern', isChecked);
        }

        function cambiarOpacidad(val) {
            overlayOpacity = parseInt(val);
            document.getElementById('opacity-val').innerText = val;
            localStorage.setItem('overlayOpacity', val);
            updateBackground();
        }

        function cambiarFondo(url) {
            if(url.trim() === '') { quitarFondo(); return; }
            if(!url.startsWith('http') && !url.startsWith('data:')) url = 'https://' + url;
            savedBgImage = url;
            localStorage.setItem('bgImage', url);
            document.getElementById('bg-file-input').value = '';
            updateBackground();
        }

        function cargarImagenLocal(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    savedBgImage = e.target.result;
                    localStorage.setItem('bgImage', savedBgImage);
                    document.getElementById('bg-url-input').value = '(Imagen local cargada)';
                    updateBackground();
                };
                reader.readAsDataURL(file);
            }
        }

        function quitarFondo() {
            savedBgImage = 'none';
            localStorage.removeItem('bgImage');
            document.getElementById('bg-url-input').value = '';
            document.getElementById('bg-file-input').value = '';
            updateBackground();
        }

        function agregarFila() {
            const hoy = new Date();
            const fechaStr = `${String(hoy.getDate()).padStart(2, '0')}/${String(hoy.getMonth()+1).padStart(2, '0')}/${hoy.getFullYear()}`;
            cuentas.push({ visible: true, name: "Nueva", capital: "", cost: "", startDate: fechaStr, modality: "Examen", status: "En curso ⏳", actual: 0, min: -10, max: 10, notes: "", url: "" });
            guardarYRenderizar();
        }

        function guardarYRenderizar() {
            localStorage.setItem('misCuentasPro', JSON.stringify(cuentas));
            renderTabla();
            renderGrafico();
        }

        // Navegación con TAB
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                const inputs = Array.from(document.querySelectorAll('#tabla-datos input, #tabla-datos select')).filter(el => !el.disabled);
                const current = document.activeElement;
                if (inputs.includes(current)) {
                    e.preventDefault();
                    const index = inputs.indexOf(current);
                    const isShift = e.shiftKey;
                    let nextIndex = isShift ? index - 1 : index + 1;
                    if (nextIndex >= inputs.length) {
                        document.querySelector('.btn-add').focus();
                    } else if (nextIndex < 0) {
                        inputs[inputs.length - 1].focus();
                    } else {
                        inputs[nextIndex].focus();
                        inputs[nextIndex].select();
                    }
                } else if (current.classList.contains('btn-add') && !e.shiftKey) {
                    e.preventDefault();
                    inputs[0].focus();
                    inputs[0].select();
                }
            }
        });

        guardarYRenderizar();
    </script>
</body>
</html>
