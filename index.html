<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pro - Gestión de Cuentas</title>
    <style>
        :root {
            /* Variables Modo Claro */
            --bg-color: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            --card-bg: rgba(255, 255, 255, 0.98);
            --text-main: #2d3748;
            --text-muted: #718096;
            --border-color: #e2e8f0;
            --input-bg: #ffffff;
            --input-border: #cbd5e0;
            --bar-bg: #edf2f7;
            --zero-line: #a0aec0;
            --axis-line: #cbd5e0;
            --shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        body.dark-mode {
            /* Variables Modo Oscuro */
            --bg-color: #1a202c;
            --card-bg: #2d3748;
            --text-main: #f7fafc;
            --text-muted: #a0aec0;
            --border-color: #4a5568;
            --input-bg: #1a202c;
            --input-border: #4a5568;
            --bar-bg: #4a5568;
            --zero-line: #718096;
            --axis-line: #4a5568;
            --shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 1700px;
            width: 100%;
            display: flex;
            gap: 20px;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        /* --- TABLA --- */
        .panel-tabla {
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            flex: 1.5;
            min-width: 850px;
            overflow-x: auto;
            transition: background 0.3s ease;
        }
        h2 { margin: 0 0 10px 0; font-size: 18px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 6px 4px; text-align: left; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
        th { font-size: 11px; color: var(--text-muted); text-transform: uppercase; white-space: nowrap; }
        
        input, select {
            padding: 6px; border: 1px solid var(--input-border); border-radius: 5px;
            font-family: inherit; font-size: 12px; box-sizing: border-box; background: var(--input-bg); color: var(--text-main);
        }
        input:focus, select:focus { border-color: #4299e1; outline: none; }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        
        .in-name { width: 90px; }
        .in-cap { width: 75px; text-align: right; }
        .in-cost { width: 65px; text-align: right; }
        .in-date { width: 85px; text-align: center; }
        .in-mod { width: 100px; }
        .in-status { width: 105px; }
        .in-num { width: 45px; text-align: center; }
        .in-notes { width: 120px; } /* Ahora es un input de una línea */
        
        .btn-add {
            background: #4299e1; color: white; border: none; padding: 10px 15px;
            border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 15px;
            width: 100%; font-size: 13px;
        }
        .btn-add:hover { background: #3182ce; }

        /* --- GRÁFICO --- */
        .panel-grafico {
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            flex: 1;
            min-width: 450px;
            overflow-x: auto;
            transition: background 0.3s ease;
        }

        .chart-layout {
            display: flex;
            height: 400px;
            position: relative;
            margin-top: 10px;
        }

        .y-axis {
            position: relative;
            width: 40px;
            height: 300px;
            border-right: 1px solid var(--axis-line);
            margin-right: 15px;
        }
        .y-tick {
            position: absolute; right: 5px; transform: translateY(-50%);
            font-size: 10px; color: var(--text-muted); font-weight: 600;
        }
        .y-tick::after { content: ''; position: absolute; right: -16px; top: 50%; width: 10px; height: 1px; background: var(--axis-line); }

        .charts-wrapper {
            display: flex; gap: 25px; flex-grow: 1;
            position: relative; height: 300px;
        }

        .global-zero-line {
            position: absolute; width: 100%; height: 1px;
            background-color: var(--zero-line); z-index: 0; border-bottom: 1px dashed var(--axis-line);
        }

        .chart-column {
            position: relative; width: 45px; height: 100%;
            flex-shrink: 0; display: flex; justify-content: center;
        }

        .bar-range-bg {
            position: absolute; width: 100%; background-color: var(--bar-bg);
            border-radius: 4px; z-index: 1;
            display: flex; justify-content: center;
        }

        /* Texto del objetivo en la parte superior de la barra gris */
        .target-text {
            position: absolute;
            top: -18px;
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .bar-fill {
            position: absolute; width: 100%; border-radius: 4px;
            z-index: 2; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center; /* Centrar texto */
        }

        /* Texto dentro del relleno */
        .val-text { font-size: 11px; font-weight: bold; }

        .labels-area {
            position: absolute; top: 100%; width: 90px;
            left: 50%; transform: translateX(-50%);
            text-align: center; padding-top: 8px;
        }

        .name-text { font-size: 11px; font-weight: 600; margin-bottom: 2px; word-wrap: break-word; }
        .cap-text { font-size: 10px; color: #3182ce; font-weight: bold; margin-bottom: 2px; }
        .status-text { font-size: 10px; margin-bottom: 2px; }
        .date-text { font-size: 9px; color: var(--text-muted); margin-bottom: 4px; }
        .notes-text { font-size: 9px; color: var(--text-muted); font-style: italic; word-wrap: break-word; line-height: 1.1;}

        /* --- CONFIGURACIÓN FLOTANTE --- */
        .settings-btn {
            position: fixed; bottom: 20px; left: 20px;
            background: var(--card-bg); color: var(--text-main);
            border: 1px solid var(--border-color); border-radius: 50%;
            width: 45px; height: 45px; font-size: 20px; cursor: pointer;
            box-shadow: var(--shadow); z-index: 100;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s;
        }
        .settings-btn:hover { transform: rotate(90deg); }

        .settings-panel {
            position: fixed; bottom: 75px; left: 20px;
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 10px; padding: 15px; width: 220px;
            box-shadow: var(--shadow); z-index: 100;
            display: none; flex-direction: column; gap: 12px;
        }
        .settings-panel.active { display: flex; }
        
        .settings-panel label { font-size: 12px; font-weight: 600; display: flex; justify-content: space-between; align-items: center;}
        .settings-panel input[type="color"] { width: 30px; height: 25px; padding: 0; border: none; cursor: pointer; }
        .toggle-btn {
            background: #4299e1; color: white; border: none; padding: 8px;
            border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Panel Tabla -->
        <div class="panel-tabla">
            <h2>Gestión de Cuentas</h2>
            <table id="tabla-datos">
                <thead>
                    <tr>
                        <th>Cuenta</th>
                        <th>Capital</th>
                        <th>Costo</th>
                        <th>Inicio</th>
                        <th>Modalidad</th>
                        <th>Estado</th>
                        <th>Actual</th>
                        <th>Mínimo</th>
                        <th>Objetivo</th>
                        <th>Notas</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            <button class="btn-add" onclick="agregarFila()">+ Añadir Cuenta</button>
        </div>

        <!-- Panel Gráfico -->
        <div class="panel-grafico">
            <h2>Progreso Visual</h2>
            <div class="chart-layout">
                <div class="y-axis" id="y-axis"></div>
                <div class="charts-wrapper" id="chart-area">
                    <div class="global-zero-line" id="global-zero-line"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Configuración Flotante -->
    <button class="settings-btn" onclick="toggleSettings()">⚙️</button>
    <div class="settings-panel" id="settings-panel">
        <label>Color Positivo: <input type="color" id="color-pos" value="#38a169" onchange="guardarColores()"></label>
        <label>Color Negativo: <input type="color" id="color-neg" value="#e53e3e" onchange="guardarColores()"></label>
        <button class="toggle-btn" onclick="toggleDarkMode()">Modo Oscuro 🌙 / ☀️</button>
    </div>

    <script>
        // --- DATOS INICIALES ---
        let cuentas = JSON.parse(localStorage.getItem('misCuentasPro')) || [
            { name: "FTMO 100k", capital: "$100.000", cost: "$510", startDate: "01/09/2024", modality: "Examen", status: "En curso ⏳", actual: -9.4, min: -10, max: 10, notes: "Fase 1/2" },
            { name: "FTMO 25k", capital: "$25.000", cost: "$250", startDate: "02/10/2024", modality: "Examen", status: "Aprobado ✅", actual: 10.0, min: -10, max: 10, notes: "Fase 1/2" },
            { name: "Bullfy", capital: "$5.000", cost: "$100", startDate: "10/10/2026", modality: "Mixto", status: "Desaprobado ❌", actual: 6.0, min: -4, max: 8, notes: "Fase Única" },
            { name: "Personal", capital: "$10.000", cost: "-", startDate: "15/11/2026", modality: "Capital propio", status: "En curso ⏳", actual: 2.5, min: null, max: null, notes: "Ahorros" }
        ];

        let colores = JSON.parse(localStorage.getItem('misColores')) || { pos: "#38a169", neg: "#e53e3e" };
        let isDarkMode = localStorage.getItem('darkMode') === 'true';

        document.getElementById('color-pos').value = colores.pos;
        document.getElementById('color-neg').value = colores.neg;
        
        if(isDarkMode) document.body.classList.add('dark-mode');

        // --- UTILIDADES ---
        function formatCurrency(input) {
            let val = input.value.replace(/\D/g, ''); 
            if(val === '') { input.value = ''; return; }
            input.value = '$' + parseInt(val, 10).toLocaleString('es-AR');
        }

        function formatDate(input) {
            let val = input.value.replace(/\D/g, '');
            if (val.length > 2 && val.length <= 4) val = val.substring(0, 2) + '/' + val.substring(2);
            else if (val.length > 4) val = val.substring(0, 2) + '/' + val.substring(2, 4) + '/' + val.substring(4, 8);
            input.value = val;
        }

        function parseDate(dateStr) {
            if(!dateStr) return new Date(0);
            const parts = dateStr.split('/');
            if(parts.length === 3) return new Date(parts[2], parts[1]-1, parts[0]);
            return new Date(dateStr);
        }

        // Calcular si el texto debe ser negro o blanco según el fondo
        function getContrastColor(hexcolor) {
            if(!hexcolor) return '#ffffff';
            let r = parseInt(hexcolor.substr(1, 2), 16);
            let g = parseInt(hexcolor.substr(3, 2), 16);
            let b = parseInt(hexcolor.substr(5, 2), 16);
            let yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
            return (yiq >= 128) ? '#000000' : '#ffffff';
        }

        // --- RENDERIZADO TABLA ---
        function renderTabla() {
            const tbody = document.querySelector('#tabla-datos tbody');
            tbody.innerHTML = '';
            cuentas.forEach((cuenta, index) => {
                const tr = document.createElement('tr');
                const isPropio = cuenta.modality === 'Capital propio';
                
                tr.innerHTML = `
                    <td><input type="text" class="in-name" value="${cuenta.name}" onchange="actualizarDato(${index}, 'name', this.value)"></td>
                    <td><input type="text" class="in-cap" value="${cuenta.capital || ''}" onchange="actualizarDato(${index}, 'capital', this.value)" onblur="formatCurrency(this)"></td>
                    <td><input type="text" class="in-cost" value="${cuenta.cost || ''}" onchange="actualizarDato(${index}, 'cost', this.value)" onblur="formatCurrency(this)" placeholder="-$"></td>
                    <td><input type="text" class="in-date" value="${cuenta.startDate}" oninput="formatDate(this)" onchange="actualizarDato(${index}, 'startDate', this.value)" placeholder="DD/MM/AAAA"></td>
                    
                    <td>
                        <select class="in-mod" onchange="cambiarModalidad(${index}, this.value)">
                            <option value="Examen" ${cuenta.modality === 'Examen' ? 'selected' : ''}>Examen</option>
                            <option value="Capital propio" ${cuenta.modality === 'Capital propio' ? 'selected' : ''}>Capital propio</option>
                            <option value="Mixto" ${cuenta.modality === 'Mixto' ? 'selected' : ''}>Mixto</option>
                        </select>
                    </td>
                    
                    <td>
                        <select class="in-status" onchange="actualizarDato(${index}, 'status', this.value)">
                            <option value="En curso ⏳" ${cuenta.status === 'En curso ⏳' ? 'selected' : ''}>En curso ⏳</option>
                            <option value="Aprobado ✅" ${cuenta.status === 'Aprobado ✅' ? 'selected' : ''}>Aprobado ✅</option>
                            <option value="Desaprobado ❌" ${cuenta.status === 'Desaprobado ❌' ? 'selected' : ''}>Desaprobado ❌</option>
                        </select>
                    </td>

                    <td><input type="number" step="0.1" class="in-num" value="${cuenta.actual}" onchange="actualizarDato(${index}, 'actual', parseFloat(this.value))"></td>
                    <td><input type="number" step="1" class="in-num" value="${isPropio ? '' : cuenta.min}" ${isPropio ? 'disabled placeholder="N/A"' : ''} onchange="actualizarDato(${index}, 'min', parseFloat(this.value))"></td>
                    <td><input type="number" step="1" class="in-num" value="${isPropio ? '' : cuenta.max}" ${isPropio ? 'disabled placeholder="N/A"' : ''} onchange="actualizarDato(${index}, 'max', parseFloat(this.value))"></td>
                    
                    <td><input type="text" class="in-notes" value="${cuenta.notes || ''}" onchange="actualizarDato(${index}, 'notes', this.value)" placeholder="..."></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function cambiarModalidad(index, valor) {
            cuentas[index].modality = valor;
            if (valor === 'Capital propio') {
                cuentas[index].min = null;
                cuentas[index].max = null;
            } else if (cuentas[index].min === null) {
                cuentas[index].min = -10;
                cuentas[index].max = 10;
            }
            guardarYRenderizar();
        }

        // --- RENDERIZADO GRÁFICO ---
        function renderGrafico() {
            const chartArea = document.getElementById('chart-area');
            const yAxis = document.getElementById('y-axis');
            
            chartArea.innerHTML = '<div class="global-zero-line" id="global-zero-line"></div>';
            yAxis.innerHTML = '';

            cuentas.sort((a, b) => parseDate(a.startDate) - parseDate(b.startDate));

            let globalMin = 0;
            let globalMax = 0;
            cuentas.forEach(c => {
                if(c.modality !== 'Capital propio') {
                    if (c.min < globalMin) globalMin = c.min;
                    if (c.max > globalMax) globalMax = c.max;
                }
            });

            globalMin = Math.floor(globalMin / 5) * 5;
            globalMax = Math.ceil(globalMax / 5) * 5;
            if (globalMin > -10) globalMin = -10;
            if (globalMax < 10) globalMax = 10;

            const rangeGlobal = globalMax - globalMin;
            const zeroBottomPercent = ((0 - globalMin) / rangeGlobal) * 100;

            // Eje Y
            const step = rangeGlobal > 30 ? 10 : 5;
            for (let i = globalMin; i <= globalMax; i += step) {
                const topPercent = 100 - (((i - globalMin) / rangeGlobal) * 100);
                const tick = document.createElement('div');
                tick.className = 'y-tick';
                tick.style.top = `${topPercent}%`;
                tick.innerText = `${i}%`;
                yAxis.appendChild(tick);
            }

            document.getElementById('global-zero-line').style.bottom = `${zeroBottomPercent}%`;

            // Barras
            cuentas.forEach(cuenta => {
                const column = document.createElement('div');
                column.className = 'chart-column';
                const isPropio = cuenta.modality === 'Capital propio';
                
                let rangeHeightPercent = 0;
                let rangeBottomPercent = 0;
                if(!isPropio) {
                    rangeHeightPercent = ((cuenta.max - cuenta.min) / rangeGlobal) * 100;
                    rangeBottomPercent = ((cuenta.min - globalMin) / rangeGlobal) * 100;
                }

                let fillHeightPercent = (Math.abs(cuenta.actual || 0) / rangeGlobal) * 100;
                let fillBottomPercent = zeroBottomPercent;
                
                let color = cuenta.actual >= 0 ? colores.pos : colores.neg;
                let textColor = getContrastColor(color);
                let textoValor = cuenta.actual > 0 ? `+${cuenta.actual}%` : `${cuenta.actual}%`;

                if (cuenta.actual < 0) {
                    fillBottomPercent = zeroBottomPercent - fillHeightPercent;
                }
                if (cuenta.actual === 0 || cuenta.actual === null) fillHeightPercent = 0;

                // El objetivo (max) flota arriba de la barra gris
                let targetHTML = (!isPropio && cuenta.max) ? `<div class="target-text">${cuenta.max}%</div>` : '';

                column.innerHTML = `
                    ${!isPropio ? `<div class="bar-range-bg" style="bottom: ${rangeBottomPercent}%; height: ${rangeHeightPercent}%;">${targetHTML}</div>` : ''}
                    <div class="bar-fill" style="bottom: ${fillBottomPercent}%; height: ${fillHeightPercent}%; background-color: ${color};">
                        <span class="val-text" style="color: ${textColor};">${textoValor}</span>
                    </div>
                    
                    <div class="labels-area">
                        <div class="name-text">${cuenta.name}</div>
                        <div class="cap-text">${cuenta.capital || ''}</div>
                        <div class="status-text">${cuenta.status || ''}</div>
                        <div class="date-text">${cuenta.startDate || ''}</div>
                        <div class="notes-text">${cuenta.notes || ''}</div>
                    </div>
                `;
                chartArea.appendChild(column);
            });
        }

        // --- ACCIONES ---
        function actualizarDato(index, campo, valor) {
            cuentas[index][campo] = valor;
            guardarYRenderizar();
        }

        function guardarColores() {
            colores.pos = document.getElementById('color-pos').value;
            colores.neg = document.getElementById('color-neg').value;
            localStorage.setItem('misColores', JSON.stringify(colores));
            renderGrafico();
        }

        function toggleSettings() {
            document.getElementById('settings-panel').classList.toggle('active');
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            isDarkMode = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDarkMode);
        }

        function agregarFila() {
            const hoy = new Date();
            const fechaStr = `${String(hoy.getDate()).padStart(2, '0')}/${String(hoy.getMonth()+1).padStart(2, '0')}/${hoy.getFullYear()}`;
            cuentas.push({ name: "Nueva", capital: "", cost: "", startDate: fechaStr, modality: "Examen", status: "En curso ⏳", actual: 0, min: -10, max: 10, notes: "" });
            guardarYRenderizar();
        }

        function guardarYRenderizar() {
            localStorage.setItem('misCuentasPro', JSON.stringify(cuentas));
            renderTabla();
            renderGrafico();
        }

        guardarYRenderizar();
    </script>
</body>
</html>
